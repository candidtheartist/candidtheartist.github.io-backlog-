<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style id="app-style">
/* Layout: one narrow column floating over a soft color wallpaper. Everything you touch is a
   pane of Liquid Glass: the header pills, the sticky shelf bar, the list, the panels. */
/* ---------- COLOR TOKENS ----------
   Every color lives in one place, so changing the theme means editing a few lines. */
:root {
  /* Base palette: iOS-style system colors */
  --bg: #eceff6;
  --panel: #ffffff;
  --ink: #111318;
  --muted: #5d616d;
  --line: #d6d9e2;
  --backlog: #8e8e96;
  --playing: #007aff;
  --finished: #1f9d4c;
  --dropped: #e5372c;
  --star: #f5a300;
  --star-off: #c9ccd6;
  --tag: #e6e9f1;
  /* Liquid Glass: a see-through pane, a bright specular top edge, a slightly darkened rim */
  --glass: color-mix(in srgb, var(--panel) 58%, transparent);
  --glass-strong: color-mix(in srgb, var(--panel) 82%, transparent);
  --glass-hi: rgba(255, 255, 255, .85);
  --glass-rim: rgba(15, 20, 40, .10);
  --glass-shadow: 0 10px 30px -14px rgba(20, 28, 60, .28), 0 2px 6px -2px rgba(20, 28, 60, .10);
  --wall-1: color-mix(in srgb, var(--playing) 30%, transparent);
  --wall-2: color-mix(in srgb, var(--star) 22%, transparent);
  --wall-3: color-mix(in srgb, var(--finished) 22%, transparent);
  --wall-4: color-mix(in srgb, var(--dropped) 14%, transparent);
  /* Type: San Francisco on Apple devices, Inter elsewhere */
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", Inter, system-ui, sans-serif;
  --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
  /* Concentric corners: outer panes, rows inside them, controls inside those */
  --r-pane: 26px;
  --r-row: 18px;
  --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c11; --panel: #1f2027; --ink: #f5f5f7; --muted: #9c9fab; --line: #30323c;
    --backlog: #8e8e96; --playing: #0a84ff; --finished: #30d158; --dropped: #ff453a; --star: #ffd60a;
    --star-off: #3b3d48; --tag: #2a2c35;
    --glass-hi: rgba(255, 255, 255, .20); --glass-rim: rgba(0, 0, 0, .55);
    --glass-shadow: 0 12px 34px -12px rgba(0, 0, 0, .7), 0 2px 6px -2px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c11; --panel: #1f2027; --ink: #f5f5f7; --muted: #9c9fab; --line: #30323c;
  --backlog: #8e8e96; --playing: #0a84ff; --finished: #30d158; --dropped: #ff453a; --star: #ffd60a;
  --star-off: #3b3d48; --tag: #2a2c35;
  --glass-hi: rgba(255, 255, 255, .20); --glass-rim: rgba(0, 0, 0, .55);
  --glass-shadow: 0 12px 34px -12px rgba(0, 0, 0, .7), 0 2px 6px -2px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

/* ---------- COLOR SCHEMES (picked from the menu in the top-right) ----------
   Each scheme redefines the same tokens. No data-scheme = Indigo, which follows light/dark mode. */
:root[data-scheme="paper"] {
  --bg: #f1eee6; --panel: #fffdf7; --ink: #23252b; --muted: #676b73; --line: #e0dccf;
  --backlog: #b3aea0; --playing: #2e5aac; --finished: #3f8a5a; --dropped: #b8453a; --star: #d4930f;
  --star-off: #d9d3c4; --tag: #ebe6d9; color-scheme: light;
}
:root[data-scheme="slate"] {
  --bg: #eaeff1; --panel: #ffffff; --ink: #1b2529; --muted: #56676e; --line: #d2dbdf;
  --backlog: #9aaeb5; --playing: #0d8487; --finished: #3a8a4e; --dropped: #c24f3b; --star: #dc9c00;
  --star-off: #c9d3d7; --tag: #e0e8eb; color-scheme: light;
}
:root[data-scheme="handheld"] {
  --bg: #c3cd9f; --panel: #d5deb3; --ink: #1c2811; --muted: #465729; --line: #a7b581;
  --backlog: #7f8f52; --playing: #2f5e2f; --finished: #0f380f; --dropped: #8a5a24; --star: #4f6e14;
  --star-off: #b0bd8a; --tag: #bfca95; color-scheme: light;
}
:root[data-scheme="arcade"] {
  --bg: #0d0b1a; --panel: #17132b; --ink: #f4f0ff; --muted: #a99dd4; --line: #2c2550;
  --backlog: #4c4382; --playing: #ff3fa4; --finished: #2fe0bb; --dropped: #ff6b4a; --star: #ffd23f;
  --star-off: #3a3266; --tag: #241e47; --glass-hi: rgba(255, 255, 255, .18); --glass-rim: rgba(0, 0, 0, .55);
  --glass-shadow: 0 12px 34px -12px rgba(0, 0, 0, .7), 0 2px 6px -2px rgba(0, 0, 0, .5); color-scheme: dark;
}
:root[data-scheme="sunset"] {
  --bg: #1e1420; --panel: #2a1c2c; --ink: #fbe9e0; --muted: #c9a7a8; --line: #3f2b41;
  --backlog: #6f4e6b; --playing: #ff8a4c; --finished: #7ad39c; --dropped: #ff5d73; --star: #ffc857;
  --star-off: #4d3650; --tag: #372539; --glass-hi: rgba(255, 255, 255, .18); --glass-rim: rgba(0, 0, 0, .55);
  --glass-shadow: 0 12px 34px -12px rgba(0, 0, 0, .7), 0 2px 6px -2px rgba(0, 0, 0, .5); color-scheme: dark;
}

/* ---------- PAGE BASICS ---------- */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 var(--font-text);
}
main { max-width: 680px; margin: 0 auto; padding: 28px 16px 48px; }
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2rem, 9vw, 3.4rem);
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin: 0 0 6px;
}
.summary { color: var(--muted); margin: 0 0 18px; font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- HEADER + COLOR SCHEME MENU (top-right) ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-bottom: 10px; }
.top .scheme-menu { margin-left: auto; }
.top h1 { min-width: 0; }
/* Logo + editable backlog name */
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { width: clamp(44px, 11vw, 62px); height: auto; flex: none; overflow: visible; }
/* Joystick logo */
.logo .j-base { fill: color-mix(in srgb, var(--ink) 88%, var(--bg)); }
.logo .j-top { fill: color-mix(in srgb, var(--ink) 74%, var(--bg)); }
.logo .j-collar { fill: color-mix(in srgb, var(--ink) 55%, var(--bg)); }
.logo .j-stick { fill: color-mix(in srgb, var(--ink) 92%, var(--bg)); }
.logo .j-ball, .logo .j-btn { fill: var(--dropped); }
.logo .j-shine { fill: #fff; opacity: .55; }
.name-wrap { display: flex; align-items: center; gap: 6px; min-width: 0; }
.name-wrap h1 { margin: 0; overflow-wrap: break-word; text-wrap: balance; cursor: text; }
.name-wrap h1.long { font-size: clamp(1.6rem, 7vw, 2.7rem); }   /* longer names get a smaller size */
.rename {
  flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px;
  color: var(--muted); background: none; border: 0; border-radius: 8px; cursor: pointer;
}
.rename:hover { background: var(--tag); color: var(--ink); }
.rename svg { width: 16px; height: 16px; }
.name-input {
  font-family: var(--font-display); font-weight: 800;
  font-size: clamp(1.6rem, 7vw, 2.6rem); letter-spacing: -0.03em; line-height: 1.1;
  color: var(--ink); background: var(--panel);
  border: 2px solid var(--playing); border-radius: 10px; padding: 2px 10px;
  width: 100%; min-width: 0;
}
.scheme-menu { position: relative; flex: none; }

/* Page switcher: Backlog | Journal, right of the heading */
.pagenav {
  display: inline-flex; gap: 2px; padding: 3px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
}
.pagenav button {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: .9rem; font-weight: 700; color: var(--muted);
  background: none; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.pagenav button:hover { color: var(--ink); }
.pagenav button[aria-current="page"] { background: var(--ink); color: var(--bg); }
.pagenav .count {
  font-size: .72rem; font-variant-numeric: tabular-nums; padding: 0 6px; border-radius: 999px;
  background: color-mix(in srgb, currentColor 16%, transparent);
}
@media (max-width: 600px) {
  .top .pagenav { order: 3; }
}
/* On narrower screens the color button shows just its dots, to keep the header on one line longer. */
@media (max-width: 720px) {
  .scheme-btn .scheme-name { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
}
.scheme-btn {
  display: inline-flex; align-items: center; gap: 8px;
  font: inherit; font-size: .85rem; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 12px 6px 8px; cursor: pointer;
}
.scheme-btn .chev { margin-left: 2px; width: 7px; height: 7px; rotate: 45deg; translate: 0 -2px; }
.scheme-btn[aria-expanded="true"] .chev { rotate: 225deg; translate: 0 2px; }
.dots { display: inline-flex; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--panel); margin-left: -4px; }
.dots i:first-child { margin-left: 0; }
.scheme-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 30;
  width: 230px; max-width: calc(100vw - 32px);
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 12px 30px -12px rgba(10, 12, 30, .45);
  padding: 6px; display: grid; gap: 2px;
}
.scheme-opt {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px;
  font: inherit; font-size: .9rem; color: var(--ink); text-align: left;
  background: none; border: 0; border-radius: 8px; padding: 8px; cursor: pointer;
}
.scheme-opt:hover, .scheme-opt:focus-visible { background: var(--tag); }
.scheme-opt small { display: block; color: var(--muted); font-size: .75rem; }
.scheme-opt .strip { display: flex; width: 44px; height: 22px; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
.scheme-opt .strip i { flex: 1; }
.scheme-opt .check { color: var(--playing); font-weight: 700; visibility: hidden; }
.scheme-opt[aria-checked="true"] .check { visibility: visible; }

/* ---------- THE SHELF ----------
   30 slim bars, one per game, colored by status. Your whole backlog at a glance. */
/* Each spine sits at its --base offset (status); its size comes from the Dock effect in JS. */
/* The shelf sticks to the top of the screen while you scroll the list.
   Top padding leaves room for spines magnified by the Dock effect. */
.shelf-wrap {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin: 0 -16px 16px; padding: 8px 16px 2px;
  background: var(--bg);
  border-bottom: 1px solid transparent;
  transition: border-color .2s, box-shadow .2s;
}
.shelf-wrap.stuck { border-bottom-color: var(--line); box-shadow: 0 6px 12px -10px rgba(20, 24, 60, .35); }
/* pan-y: vertical swipes still scroll the page; sideways drags comb the shelf. */
/* Dock-style magnification: JS sets each spine's flex-grow (width) and --mag (height)
   every frame, so spines near the pointer swell and push their neighbours aside.
   Spines grow upward from the bottom edge (align-items: flex-end). */
.shelf { display: flex; align-items: flex-end; gap: 3px; height: 48px; touch-action: pan-y; }
/* The spines sit in a sideways scroller. Its top padding is the room magnified spines rise into. */
.shelf-scroll { padding-top: 30px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; overscroll-behavior-x: contain; }
.shelf-scroll::-webkit-scrollbar { display: none; }
/* Big libraries: fixed-width spines, and the shelf scrolls sideways. */
.shelf.scroll { width: max-content; min-width: 100%; touch-action: pan-y; }   /* sideways drags comb the shelf; JS scrolls it at the edges */
.shelf.scroll { gap: 4px; }
.shelf.scroll .spine { flex: none; width: 20px; border-radius: 6px; }
.shelf-scroll.more-left { -webkit-mask-image: linear-gradient(to right, transparent, #000 28px); mask-image: linear-gradient(to right, transparent, #000 28px); }
.shelf-scroll.more-right { -webkit-mask-image: linear-gradient(to left, transparent, #000 28px); mask-image: linear-gradient(to left, transparent, #000 28px); }
.shelf-scroll.more-left.more-right {
  -webkit-mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
  mask-image: linear-gradient(to right, transparent, #000 28px, #000 calc(100% - 28px), transparent);
}
.spine {
  flex: 1 1 0; min-width: 0;
  height: calc(48px * var(--mag, 1));
  border: 0; padding: 0; cursor: pointer;
  border-radius: 3px;
  background: var(--backlog);
  transform: translateY(var(--base, 0px));
  margin-bottom: var(--rise, 0px);   /* the whole spine lifts off the shelf (set from JS) */
  transition: background-color .25s, transform .16s ease-out;
}
.spine.playing  { background: var(--playing); --base: -6px; }   /* games in progress sit a little proud */
.spine.finished { background: var(--finished); }
.spine.dropped  { background: var(--dropped); opacity: .55; }
/* The selected game sits a little higher and bounces when it's picked. */
.spine.selected { --base: -12px; filter: saturate(1.25) brightness(1.08); animation: pop .55s ease-out; }
.spine.dropped.selected { opacity: .85; }
@keyframes pop {
  0%   { translate: 0 0; }
  30%  { translate: 0 -9px; }
  55%  { translate: 0 2px; }
  75%  { translate: 0 -3px; }
  100% { translate: 0 0; }
}
.spine:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Name under the shelf: a small caret points at the spine, the text follows it. */
/* The name sits ABOVE the shelf, with a small arrow pointing down at its spine. */
.shelf-label { position: relative; height: calc(1.5em + 9px); font-size: var(--shelf-font, 15px); flex: 1; min-width: 0; }
/* No text selection, copy/paste bubbles, long-press menus or tap flashes anywhere on the shelf. */
.shelf-wrap, .shelf-wrap * {
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-user-drag: none;
}
.shelf-foot { display: flex; align-items: flex-start; gap: 8px; }
.shelf-opts { position: relative; flex: none; }
.sopts-btn {
  width: 34px; height: 34px; display: grid; place-items: center; margin-top: 2px;
  color: var(--ink); border-radius: 50%; cursor: pointer; touch-action: manipulation;
}
.sopts-btn svg { width: 18px; height: 18px; }
.sopts-btn[aria-expanded="true"] { color: var(--playing); }
.sopts-panel {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 30;
  width: 300px; max-width: calc(100vw - 32px);
  display: grid; gap: 10px; padding: 14px; border-radius: var(--r-row);
}
.sopts-panel .panel-label { margin: 0; }
.seg { display: flex; padding: 3px; gap: 2px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
.seg button {
  flex: 1; font: inherit; font-size: .84rem; font-weight: 600; color: var(--muted);
  background: transparent; border: 0; border-radius: 999px; padding: 6px 8px; cursor: pointer; touch-action: manipulation;
}
.seg button[aria-checked="true"] {
  color: var(--ink); background: var(--glass-strong);
  box-shadow: inset 0 1px 0 var(--glass-hi), 0 2px 6px -2px rgba(20, 28, 60, .3);
}
.sopts-note { margin: 0; font-size: .84rem; color: var(--muted); line-height: 1.4; }
/* Follow-the-list mode: the shelf can't be dragged; spines for games on screen lift a little. */
.shelf-scroll[data-mode="follow"] { overflow-x: hidden; }
.shelf.scroll[data-mode="swipe"] { touch-action: pan-x pan-y; }
.spine.in-view:not(.selected) { --base: -7px; }
.shelf-label .caret {
  position: absolute; bottom: 0; width: 0; height: 0;
  border: 5px solid transparent; border-top-color: var(--ink); border-bottom: 0;
  translate: -50% 0; transition: left .12s ease-out;
}
.shelf-label .text {
  position: absolute; top: 0; left: 0; max-width: 100%; line-height: 1.5;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: left .12s ease-out;
}
.shelf-label.idle .caret { display: none; }
.shelf-label.idle .text { color: var(--muted); font-size: .92em; }
.lbl-genre { font-size: .78em; color: var(--muted); opacity: .8; font-weight: 500; }
/* Follow mode: an arrow under the shelf marks the game at the top of the list you're viewing. */
.follow-mark { position: relative; height: 10px; margin-top: 3px; }
.follow-mark span {
  position: absolute; top: 0; left: 0; width: 0; height: 0; translate: -50% 0;
  border: 6px solid transparent; border-bottom-color: var(--playing); border-top: 0;
  opacity: 0; transition: opacity .2s;
}
.follow-mark.on span { opacity: 1; }
/* Genre: a small, faint tag right after a game's title */
.genre {
  display: inline-block; margin-left: 8px; vertical-align: .1em;
  font-size: .68rem; font-weight: 600; letter-spacing: .02em; color: var(--muted); opacity: .85;
  padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 6%, transparent);
}
.fsize { display: flex; align-items: center; gap: 10px; }
.fsize input { flex: 1; accent-color: var(--playing); }
.fsize .a-sm { font-size: .75rem; font-weight: 700; color: var(--muted); }
.fsize .a-lg { font-size: 1.2rem; font-weight: 700; color: var(--muted); }
.lbl-status { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.lbl-status.backlog  { color: var(--muted); }
.lbl-status.playing  { color: var(--playing); }
.lbl-status.finished { color: var(--finished); }
.lbl-status.dropped  { color: var(--dropped); }
.lbl-meta { color: var(--muted); }

/* A row flashes when you jump to it from the shelf. */
li[data-index] { scroll-margin-top: 140px; }
/* The selected game (picked on the shelf or clicked in the list) stays highlighted
   until you pick another, or press Escape. */
li.picked {
  background: color-mix(in srgb, var(--playing) 9%, var(--panel));
  box-shadow: inset 0 0 0 2px var(--playing);
}
li.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: color-mix(in srgb, var(--playing) 28%, var(--panel)); } }

/* ---------- ADD A GAME (between the shelf and the list) ---------- */
.add-game { margin: 0 0 16px; }
.add-toggle {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  font: inherit; font-size: .95rem; font-weight: 700; color: var(--playing);
  background: transparent; border: 1.5px dashed color-mix(in srgb, var(--playing) 55%, var(--line));
  border-radius: 12px; padding: 10px 14px; cursor: pointer;
}
.add-toggle:hover { background: color-mix(in srgb, var(--playing) 7%, transparent); }
.add-buttons { display: flex; gap: 8px; }
.add-buttons .add-toggle { flex: 1 1 0; min-width: 0; }
.steam-toggle svg { width: 18px; height: 18px; flex: none; }
.steam-done { margin: 8px 2px 0; color: var(--finished); font-weight: 700; }
/* Import from Steam */
.steam-steps { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; font-size: .92rem; }
.steam-steps > li { display: list-item; padding: 0; border: 0; }
.steam-panel a { color: var(--playing); }
.steam-panel code { font-size: .85em; background: var(--tag); border-radius: 4px; padding: 1px 5px; }
.steam-api { font-size: .88rem; border: 1px solid var(--line); border-radius: 10px; }
.steam-api summary { cursor: pointer; padding: 8px 12px; color: var(--muted); font-weight: 700; }
.steam-api-body { display: grid; gap: 8px; padding: 0 12px 12px; }
.steam-api-body p { margin: 0; }
.steam-api .field { flex: 1 1 12em; }
.steam-open { font-weight: 700; }
textarea.steam-text { min-height: 9em; font-size: .85rem; }
.steam-found { margin: 0; font-size: .92rem; }
.shead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.sbulk { display: flex; gap: 12px; }
.steam-q { width: 100%; margin-bottom: 6px; }
.slist { list-style: none; margin: 0 0 4px; padding: 0; background: var(--bg); border-radius: 10px; overflow: auto; max-height: 15rem; }
.slist.tall { max-height: 22rem; }
.slist > li.srow { display: block; padding: 0; border: 0; border-bottom: 1px solid var(--line); }
.slist > li.srow:last-child { border-bottom: 0; }
.srow label { display: flex; align-items: center; gap: 10px; padding: 8px 10px; cursor: pointer; }
.srow input { width: 1.05rem; height: 1.05rem; flex: none; accent-color: var(--playing); }
.srow input:disabled + .sname { color: var(--muted); }
.sname { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .92rem; }
.shrs { font-size: .8rem; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.shrs b { color: var(--ink); }
.srow.none { padding: 10px; color: var(--muted); font-size: .88rem; }
.steam-panel .add:disabled { opacity: .5; cursor: default; }
@media (max-width: 420px) { .add-buttons { flex-direction: column; } }
.add-toggle .plus { font-size: 1.2rem; line-height: 1; }
.add-panel {
  display: grid; gap: 14px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-top: 8px;
}
.add-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.add-head h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.25rem; margin: 0; }
.add-row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.add-panel label.panel-label { display: block; }
.add-panel .field.f-title { width: 100%; font-size: 1rem; padding: 8px 10px; }
.add-panel .status button { font-size: .85rem; padding: 3px 10px; }
.check-row { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; cursor: pointer; }
.check-row input { width: 1.05rem; height: 1.05rem; accent-color: var(--playing); }

/* ---------- JOURNAL PAGE: every entry, including games since removed ---------- */
.tools.jtools { grid-template-columns: 1fr minmax(0, 12em) auto; }
@media (max-width: 520px) { .tools.jtools { grid-template-columns: 1fr 1fr; } }
.jfilter { margin: 0 0 6px; }
.jfilter .mood { padding-right: 10px; }
.jfilter .mood .n { font-size: .75rem; color: var(--muted); font-variant-numeric: tabular-nums; font-weight: 400; }
.jmonth {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--font-display); font-weight: 800; font-size: 1.15rem;
  margin: 22px 0 8px;
}
.jmonth span { font-family: var(--font-text); font-weight: 400; font-size: .85rem; color: var(--muted); }
.jdate {
  display: grid; justify-items: center; align-content: start; gap: 1px;
  padding: 6px 0; border-radius: 8px; background: var(--bg);
  border-top: 3px solid var(--mood, var(--line));
  font-variant-numeric: tabular-nums;
}
.jwk, .jmon { font-size: .68rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.jday { font-family: var(--font-display); font-weight: 800; font-size: 1.45rem; line-height: 1; }
.jhead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: .85rem; color: var(--muted); }
.jgame {
  font: inherit; font-size: 1rem; font-weight: 700; color: var(--ink); text-align: left;
  background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px;
}
.jgame:hover { text-decoration-color: var(--playing); }
.jgame.gone { cursor: default; text-decoration: none; color: var(--muted); }
.jmeta { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: baseline; }
.jmeta .stamps { margin: 0; }
.jhead .entry-actions { margin-left: auto; }
/* Day groups (collapsible) holding game groups (collapsible) holding entries */
.jday-group { background: var(--panel); border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
.jday-sum, .jgame-sum { list-style: none; cursor: pointer; }
.jday-sum::-webkit-details-marker, .jgame-sum::-webkit-details-marker { display: none; }
.jday-sum { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
.jday-sum .jdate { width: 56px; flex: none; }
.jday-info { display: grid; gap: 2px; min-width: 0; flex: 1; }
.jday-info strong { font-size: 1rem; }
.jday-info span { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.jday-group[open] > .jday-sum .chev, .jgame-group[open] > .jgame-sum .chev { rotate: 225deg; translate: 0 2px; }
.jday-sum .chev, .jgame-sum .chev { margin-left: 4px; }
.jday-body { display: grid; gap: 8px; padding: 0 14px 14px; }
.jgame-group { background: var(--bg); border-radius: 10px; }
.jgame-sum { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 10px 12px; }
.jgame-name { font-weight: 700; }
.jgame-name.gone { color: var(--muted); }
.jgame-sub { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.jgame-sub { margin-right: auto; }   /* pushes the photo count, moods and arrow to the right */
.jday-sum:focus-visible, .jgame-sum:focus-visible { outline: 2px solid var(--playing); outline-offset: -2px; border-radius: 10px; }
.jfaces { display: inline-flex; gap: 2px; flex: none; }
.jfaces svg { width: 18px; height: 18px; display: block; }
.jgame-body { display: grid; gap: 8px; padding: 0 12px 12px; }
.jopen {
  justify-self: start; font: inherit; font-size: .8rem; color: var(--playing);
  background: none; border: 0; padding: 0; cursor: pointer;
}
.jitem {
  display: grid; gap: 4px; min-width: 0;
  background: var(--panel); border-radius: 8px; padding: 10px 12px;
  border-left: 3px solid var(--mood, var(--line));
}
.jtime { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.jitem .edit-form { background: var(--bg); }
/* ---------- PHOTOS & VIDEOS on journal entries ---------- */
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; margin-top: 6px; }
.mtile {
  position: relative; aspect-ratio: 1; max-width: 100%;
  border: 0; padding: 0; border-radius: 8px; overflow: hidden; cursor: zoom-in;
  background: var(--tag);
}
.mtile img, .mtile video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.mtile .play, .mthumb .play {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
}
.play svg { width: 30px; height: 30px; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .5)); }
.mtile:focus-visible { outline: 2px solid var(--playing); outline-offset: 2px; }
.media-count { display: inline-flex; align-items: center; gap: 3px; font-size: .78rem; color: var(--muted); }
.media-count svg { width: 14px; height: 14px; }

/* In the log / edit forms */
.media-field { display: grid; gap: 6px; }
.mthumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.mthumbs:empty { display: none; }
.mthumb { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--tag); }
.mthumb img, .mthumb video { width: 100%; height: 100%; object-fit: cover; display: block; }
.mthumb .x {
  position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
  display: grid; place-items: center; font-size: 15px; line-height: 1;
  color: #fff; background: rgba(10, 12, 24, .7); border: 0; border-radius: 50%; cursor: pointer;
}
.mthumb.busy {
  display: grid; place-items: center; font-size: .72rem; color: var(--muted);
  background: linear-gradient(90deg, var(--tag), var(--panel), var(--tag)); background-size: 200% 100%;
  animation: shimmer 1.2s linear infinite;
}
@keyframes shimmer { to { background-position: -200% 0; } }
.media-add {
  justify-self: start; display: inline-flex; align-items: center; gap: 8px;
  font-size: .85rem; font-weight: 700; color: var(--playing);
  border: 1.5px dashed color-mix(in srgb, var(--playing) 55%, var(--line)); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; background: var(--panel);
}
.media-add svg { width: 18px; height: 18px; }
.media-add:focus-within { outline: 2px solid var(--playing); outline-offset: 2px; }
.media-add input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.media-msg { font-size: .8rem; color: var(--dropped); margin: 0; }
.media-msg:empty { display: none; }

/* Full-screen viewer: one deliberate dark look in every color scheme */
.lightbox {
  position: fixed; inset: 0; z-index: 100;
  display: grid; place-items: center; padding: 60px 16px 24px;
  background: rgba(8, 10, 20, .9);
}
.lb-figure { margin: 0; display: grid; gap: 10px; justify-items: center; max-width: 100%; }
.lb-figure img, .lb-figure video {
  max-width: min(100%, 1100px); max-height: calc(100vh - 150px); object-fit: contain; border-radius: 8px; display: block;
}
.lb-figure figcaption { color: #e9ecf5; font-size: .9rem; text-align: center; }
.lb-close, .lb-nav {
  position: fixed; display: grid; place-items: center;
  color: #fff; background: rgba(255, 255, 255, .12); border: 0; border-radius: 50%; cursor: pointer;
}
.lb-close { top: calc(12px + env(safe-area-inset-top, 0px)); right: 12px; width: 42px; height: 42px; font-size: 24px; }
.lb-nav { top: 50%; translate: 0 -50%; width: 44px; height: 44px; font-size: 26px; }
.lb-nav.prev { left: 10px; }
.lb-nav.next { right: 10px; }
.lb-close:hover, .lb-nav:hover { background: rgba(255, 255, 255, .24); }
.lb-close:focus-visible, .lb-nav:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .mthumb.busy { animation: none; } }
/* ---------- COMPLETED PAGE: finished games, with a hand-ranked Top list ---------- */
.ctools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
.ctools label { display: flex; align-items: center; gap: 8px; font-size: .85rem; color: var(--muted); }
.ctools select {
  font: inherit; font-size: .95rem; color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
.ctools .hint { margin-left: auto; }
.clist { list-style: none; margin: 0; padding: 0; background: none; border-radius: 0; overflow: visible; display: grid; gap: 8px; }
.clist > li.crow {
  display: grid; grid-template-columns: 3.2rem 1fr auto; align-items: center; gap: 12px;
  padding: 12px 12px 12px 8px; border: 0; border-radius: 12px; background: var(--panel);
  border-left: 5px solid var(--finished);
}
.crank {
  font-family: var(--font-display); font-weight: 800;
  font-size: 1.7rem; line-height: 1; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums;
}
.crank small { display: block; font-family: var(--font-text); font-weight: 700; font-size: .6rem; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2px; }
/* The top three get a louder number and a gold edge. */
.clist.ranked > li.top .crank { color: var(--star); font-size: 2.2rem; }
.clist.ranked > li.top { border-left-color: var(--star); }
.clist.ranked > li.top1 { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--star) 55%, transparent); }
.clist > li.jempty { display: block; border: 0; }
.cinfo { min-width: 0; display: grid; gap: 4px; }
.ctitle { font-weight: 700; font-size: 1.05rem; overflow-wrap: anywhere; }
.cmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.rating.sm .rs { font-size: 1rem; }
.cmeta .jopen { font-size: .82rem; }
.cmove { display: flex; align-items: center; gap: 2px; }
.cmove button {
  width: 32px; height: 32px; display: grid; place-items: center;
  font: inherit; font-size: 1rem; color: var(--muted); background: none; border: 0; border-radius: 8px; cursor: pointer;
}
.cmove button:hover:not(:disabled) { background: var(--tag); color: var(--ink); }
.cmove button:disabled { opacity: .3; cursor: default; }
.chandle { cursor: grab; touch-action: none; }
.chandle svg { width: 18px; height: 18px; }
.clist > li.dragging {
  position: relative; z-index: 3; cursor: grabbing;
  box-shadow: 0 14px 30px -12px rgba(10, 12, 30, .5); transition: none;
}
.clist > li.moved { animation: settle .35s ease-out; }
@keyframes settle { from { background: color-mix(in srgb, var(--star) 22%, var(--panel)); } }
/* Other sorts ignore the Top list: no rank numbers, no gold. */
.clist:not(.ranked) > li.crow { grid-template-columns: 1fr; padding-left: 14px; }
.cexp {
  justify-self: start; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px;
  font: inherit; font-size: .82rem; font-weight: 700; color: var(--ink); background: var(--tag);
  border: 0; border-radius: 999px; padding: 5px 14px 5px 12px; cursor: pointer;
}
.cexp:hover { filter: brightness(.95); }
.cexp .chev { margin-left: 4px; border-color: currentColor; }
.cexp[aria-expanded="true"] .chev { rotate: 225deg; translate: 0 2px; }
.cexp .media-count { display: inline-flex; align-items: center; gap: 3px; }
.cexp .media-count svg { width: 14px; height: 14px; }
.cover {
  grid-column: 1 / -1; display: grid; gap: 10px; margin-top: 4px; padding-top: 12px;
  border-top: 1px solid var(--line);
}
.cover.fresh { animation: coverIn .2s ease-out; }
@keyframes coverIn { from { opacity: 0; transform: translateY(-4px); } }
.cstats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cstats b { color: var(--ink); }
.cmoods { display: flex; flex-wrap: wrap; gap: 6px; }
.cmoods .entry-mood { font-size: .82rem; background: var(--tag); border-radius: 999px; padding: 3px 10px 3px 6px; }
.csub { margin: 4px 0 0; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.cgallery { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); margin-top: 0; }
.centries { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.centry { display: block; padding: 8px 10px; border-radius: 10px; background: color-mix(in srgb, var(--tag) 55%, transparent); border-left: 3px solid var(--line); }
.centry[class*="m-"] { border-left-color: var(--mood); }
.cehead { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 12px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.cedate { font-weight: 700; color: var(--ink); }
.cenote { margin: 4px 0 0; font-size: .9rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.cnone { margin: 0; font-size: .88rem; color: var(--muted); }
.cover > .jopen { justify-self: start; }
@media (prefers-reduced-motion: reduce) { .cover { animation: none; } .cexp .chev { transition: none; } }
@media (max-width: 520px) {
  .clist > li.crow { grid-template-columns: 2.6rem 1fr; }
  .clist:not(.ranked) > li.crow { grid-template-columns: 1fr; }
  .cmove { grid-column: 1 / -1; justify-content: flex-end; margin-top: -4px; }
}
@media (prefers-reduced-motion: reduce) { .clist > li.moved { animation: none; } }
.jempty { background: var(--panel); border-radius: 12px; padding: 28px 20px; text-align: center; color: var(--muted); }
.jempty strong { display: block; color: var(--ink); font-size: 1.05rem; margin-bottom: 4px; }

/* ---------- SEARCH + SORT + PLATFORM ---------- */
.tools { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; margin-bottom: 10px; }
.tools label { display: block; min-width: 0; }
.tools input, .tools select {
  width: 100%;
  font: inherit; font-size: .95rem;
  color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 12px;
}
.tools input::placeholder { color: var(--muted); }
@media (max-width: 520px) {
  .tools { grid-template-columns: 1fr 1fr; }
  .tools .search { grid-column: 1 / -1; }
}

/* ---------- FILTER TABS ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.filters button {
  font: inherit; font-size: .9rem;
  border: 1px solid var(--line);
  background: var(--panel); color: var(--ink);
  border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* ---------- GAME LIST ---------- */
ul { list-style: none; margin: 0; padding: 0; background: var(--panel); border-radius: 12px; overflow: hidden; }
li {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  border-left: 5px solid var(--backlog);
}
li:last-child { border-bottom: 0; }
li.playing  { border-left-color: var(--playing); }
li.finished { border-left-color: var(--finished); }
li.dropped  { border-left-color: var(--dropped); }
li.dropped .title { text-decoration: line-through; color: var(--muted); }

.star {
  font-size: 1.3rem; line-height: 1;
  background: none; border: 0; cursor: pointer;
  color: var(--line); padding: 4px 2px; align-self: start;
}
.star[aria-pressed="true"] { color: var(--star); }

.info { display: grid; gap: 6px; min-width: 0; }
.headline { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.title { font-weight: 700; min-width: 0; }
.hrs { color: var(--muted); font-size: .85rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  font-size: .72rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  background: var(--tag); color: var(--muted);
  border-radius: 4px; padding: 1px 6px;
}

.status { display: flex; gap: 4px; flex-wrap: wrap; }
.status button {
  font: inherit; font-size: .8rem;
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  border-radius: 6px; padding: 2px 8px; cursor: pointer;
}
.status button[aria-pressed="true"] { color: #fff; border-color: transparent; }
.status button[data-status="backlog"][aria-pressed="true"]  { background: var(--backlog); }
.status button[data-status="playing"][aria-pressed="true"]  { background: var(--playing); }
.status button[data-status="finished"][aria-pressed="true"] { background: var(--finished); }
.status button[data-status="dropped"][aria-pressed="true"]  { background: var(--dropped); }

/* ---------- RATING: 5 stars, each split into a left half (x.5) and right half (x) ---------- */
.row2 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; }
.rating { display: inline-flex; align-items: center; }
.rs { position: relative; display: inline-block; font-size: 1.35rem; line-height: 1; padding: 0 1px; }
.rs::before { content: "★"; color: var(--star-off); }
.rs::after {
  content: "★"; position: absolute; inset: 0; padding: 0 1px;
  color: var(--star); clip-path: inset(0 100% 0 0);
}
.rs.half::after { clip-path: inset(0 50% 0 0); }
.rs.full::after { clip-path: none; }
.rs button {
  position: absolute; top: 0; bottom: 0; width: 50%;
  border: 0; padding: 0; background: transparent; cursor: pointer; z-index: 1;
}
.rs button:first-child { left: 0; }
.rs button:last-child { right: 0; }
.rating-num { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 4.5em; }
/* Remove a game: a quiet link, then an inline "are you sure?" bar */
.remove-link {
  font: inherit; font-size: .8rem; color: var(--muted);
  background: none; border: 0; padding: 2px 0; cursor: pointer;
}
.remove-link:hover { color: var(--dropped); }
.remove-confirm {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px;
  padding: 8px 10px; border-radius: 8px; font-size: .85rem;
  background: color-mix(in srgb, var(--dropped) 10%, var(--panel));
  border: 1px solid color-mix(in srgb, var(--dropped) 40%, var(--line));
}
.remove-confirm span { flex: 1 1 12em; min-width: 0; }
.remove-confirm .yes {
  font: inherit; font-size: .8rem; font-weight: 700; color: #fff;
  background: var(--dropped); border: 0; border-radius: 6px; padding: 4px 12px; cursor: pointer;
}
.remove-confirm .no {
  font: inherit; font-size: .8rem; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 12px; cursor: pointer;
}
.more {
  margin-left: auto;
  font: inherit; font-size: .8rem; color: var(--playing);
  background: none; border: 0; padding: 2px 0; cursor: pointer;
}

/* ---------- JOURNAL PANEL: totals, log a session, past entries ---------- */
.details {
  display: grid; gap: 14px;
  padding: 12px; border-radius: 8px; background: var(--bg);
}
.totals { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.panel-label {
  font-size: .72rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  color: var(--muted); margin: 0 0 6px;
}
.log { display: grid; gap: 8px; }
.log-fields { display: flex; flex-wrap: wrap; gap: 8px; }
.field {
  font: inherit; font-size: .9rem; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
  min-width: 0;
}
.field::placeholder { color: var(--muted); }
.field.f-hours { width: 6.5em; font-variant-numeric: tabular-nums; }
.field.f-platform { flex: 1 1 8em; }
/* Mood picker: four faces, pick one (or none) */
.moods { display: flex; flex-wrap: wrap; gap: 6px; }
.mood {
  display: inline-flex; align-items: center; gap: 6px;
  font: inherit; font-size: .85rem; color: var(--muted);
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 12px 4px 6px; cursor: pointer;
}
.mood svg { width: 20px; height: 20px; flex: none; }
.mood[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-color: var(--mood); box-shadow: inset 0 0 0 1px var(--mood); }
.face { fill: none; stroke: var(--mood); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.cexp, .cancel, .tools input, .tools select, .ctools select, .more-row button, .pagenav {

<main id="app"></main>

<!-- YOUR DATA. Everything the tracker knows lives in this block.
     When you change something, the page rewrites this JSON and saves a new version of itself. -->
<script id="saved-state" type="application/json">{"name": "My Backlog", "archive": [], "games": [], "ranking": []}</script>

<script id="app-script">
// ============================================================
// 1. SETUP: statuses, platforms, and our starting data
// ============================================================
const STATUSES = ["backlog", "playing", "finished", "dropped"];
const LABELS = { backlog: "Backlog", playing: "Playing", finished: "Finished", dropped: "Dropped" };
const STATUS_ORDER = { playing: 0, backlog: 1, finished: 2, dropped: 3 };
const PLATFORMS = ["PC", "Steam Deck", "PS5", "Xbox", "Switch"];
const MOODS = { happy: "Happy", sad: "Sad", meh: "Meh", angry: "Angry" };
const GENRES = ["Action", "Action RPG", "Adventure", "Narrative", "RPG", "JRPG", "Shooter", "Strategy", "Tactics",
  "Simulation", "City Builder", "Puzzle", "Platformer", "Metroidvania", "Roguelike", "Soulslike", "Racing", "Sports",
  "Fighting", "Horror", "Survival", "Sandbox", "Stealth", "Rhythm", "Visual Novel", "Party", "MMO", "Card Game",
  "Beat 'em up", "Tool", "Soundtrack"];
// A genre picker: the usual genres, plus the game's own genre if it's something else.
function genreOptions(current) {
  const list = current && !GENRES.includes(current) ? [current, ...GENRES] : GENRES;
  return `<option value="">No genre</option>` + list.map((x) => `<option value="${escapeHtml(x)}" ${x === current ? "selected" : ""}>${escapeHtml(x)}</option>`).join("");
}
const SORTS = { shelf: "Shelf order", title: "Title A–Z", rating: "Top rated", hours: "Most hours", recent: "Recently played", status: "Status" };

// Read the JSON block above and turn it into a JavaScript object.
// Standalone app: your library is saved on this device (localStorage). The block above is
// only the empty starting point for a first launch.
let state = normalize(readSavedState() || JSON.parse(document.getElementById("saved-state").textContent));
function readSavedState() {
  try { return JSON.parse(localStorage.getItem("backlog-state")); } catch (e) { return null; }
}

// Older saves may be missing the newer fields, so fill in defaults.
function normalize(data) {
  for (const g of data.games) {
    if (!STATUSES.includes(g.status)) g.status = "backlog";
    if (typeof g.next !== "boolean") g.next = false;
    if (typeof g.hours !== "number" || !(g.hours >= 0)) g.hours = 0;
    if (typeof g.rating !== "number" || !(g.rating >= 0)) g.rating = 0;
    if (!Array.isArray(g.platforms)) g.platforms = [];
    // Journal entries: one per play session, newest first.
    // { id, date: "2026-09-29", hours: 1.5, platform: "Steam Deck", note: "..." }
    if (!Array.isArray(g.sessions)) g.sessions = [];
    if (typeof g.genre !== "string") g.genre = "";
  }
  // Journal entries from games you've removed are kept here, so the Journal page never loses them.
  // Each one is a normal entry plus { game: "Title", removedAt: "..." }.
  if (!Array.isArray(data.archive)) data.archive = [];
  // Your Top list of finished games, best first (by title). Games you finish are added at the bottom.
  if (!Array.isArray(data.ranking)) data.ranking = [];
  // The backlog's name, shown as the page heading. You can rename it.
  if (typeof data.name !== "string" || !data.name.trim()) data.name = "My Backlog";
  return data;
}

// Browser-only helpers (wrapped in try/catch because storage can be blocked).
function loadLocal(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function saveLocal(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

// How YOU are looking at the list (tab, search, sort). This is remembered
// in your browser only; it is not part of the saved backlog.
const view = { filter: "all", platform: "all", sort: "shelf", query: "" };
try { Object.assign(view, JSON.parse(localStorage.getItem("backlog-view") || "{}")); } catch (e) {}
if (!["all", "next", ...STATUSES].includes(view.filter)) view.filter = "all";
if (!["all", ...PLATFORMS].includes(view.platform)) view.platform = "all";
if (!SORTS[view.sort]) view.sort = "shelf";
if (typeof view.query !== "string") view.query = "";
function saveView() {
  try { localStorage.setItem("backlog-view", JSON.stringify(view)); } catch (e) {}
}

// Which games have their journal open, and half-written entries, keyed by title.
// Kept in this browser so they survive the reload that follows every save.
const expanded = new Set(loadLocal("backlog-open", []));
const drafts = loadLocal("backlog-drafts", {});
const saveOpen = () => saveLocal("backlog-open", [...expanded]);
const saveDrafts = () => saveLocal("backlog-drafts", drafts);
let draftTimer = null;
const saveDraftsSoon = () => { clearTimeout(draftTimer); draftTimer = setTimeout(saveDrafts, 300); };

// Short-lived, on-screen-only state.
let pendingDelete = null;   // id of the entry waiting for "Confirm"
let highlighted = null;     // game picked from the shelf, highlighted in the list
let pendingRemove = null;   // game waiting for "Remove" to be confirmed
let editing = null;         // { id, date, time, hours, platform, mood, note } while an entry is being edited
const formErrors = {};      // title -> message under the log form

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function fmtDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const opts = { month: "short", day: "numeric" };
  if (y !== new Date().getFullYear()) opts.year = "numeric";
  return date.toLocaleDateString(undefined, opts);
}
function nowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
const lastPlayed = (g) => (g.sessions[0] ? g.sessions[0].date : "");

// Which journal entries are expanded (by entry id). Kept in this browser only.
const openEntries = new Set(loadLocal("backlog-open-entries", []));
const saveOpenEntries = () => saveLocal("backlog-open-entries", [...openEntries]);
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

// COLOR SCHEMES: the menu in the top-right. Your choice is remembered
// in this browser only (it isn't part of the saved backlog).
// ============================================================
const SCHEMES = [
  { key: "",         name: "Glass",    note: "Follows light / dark mode", colors: ["#eceff6", "#007aff", "#1f9d4c", "#e5372c"] },
  { key: "paper",    name: "Paper",    note: "Warm and light",            colors: ["#f1eee6", "#2e5aac", "#3f8a5a", "#b8453a"] },
  { key: "slate",    name: "Slate",    note: "Cool and light",            colors: ["#eaeff1", "#0d8487", "#3a8a4e", "#c24f3b"] },
  { key: "handheld", name: "Handheld", note: "Green LCD screen",          colors: ["#c3cd9f", "#2f5e2f", "#0f380f", "#8a5a24"] },
  { key: "arcade",   name: "Arcade",   note: "Neon after dark",           colors: ["#0d0b1a", "#ff3fa4", "#2fe0bb", "#ff6b4a"] },
  { key: "sunset",   name: "Sunset",   note: "Warm and dark",             colors: ["#1e1420", "#ff8a4c", "#7ad39c", "#ff5d73"] },
];
let scheme = loadLocal("backlog-scheme", "");
if (!SCHEMES.some((s) => s.key === scheme)) scheme = "";

function applyScheme(key) {
  scheme = key;
  if (key) document.documentElement.dataset.scheme = key;
  else delete document.documentElement.dataset.scheme;
  saveLocal("backlog-scheme", key);
}
applyScheme(scheme);   // apply right away, before the page draws

let schemeOpen = false;
function renderSchemeMenu() {
  const current = SCHEMES.find((s) => s.key === scheme);
  const dots = (c) => c.slice(1).map((x) => `<i style="background:${x}"></i>`).join("");
  document.getElementById("scheme-menu").innerHTML = `
    <button class="scheme-btn" data-scheme-toggle aria-haspopup="true" aria-expanded="${schemeOpen}"
      aria-label="Color scheme: ${current.name}">
      <span class="dots" aria-hidden="true">${dots(current.colors)}</span><span class="scheme-name">${current.name}</span><span class="chev" aria-hidden="true"></span>
    </button>
    ${schemeOpen ? `
      <div class="scheme-list" role="menu" aria-label="Color scheme">
        ${SCHEMES.map((s) => `
          <button class="scheme-opt" role="menuitemradio" aria-checked="${s.key === scheme}" data-scheme-pick="${s.key}">
            <span class="strip" aria-hidden="true">${s.colors.map((c) => `<i style="background:${c}"></i>`).join("")}</span>
            <span>${s.name}<small>${s.note}</small></span>
            <span class="check" aria-hidden="true">✓</span>
          </button>`).join("")}
      </div>` : ""}`;
}

function setSchemeOpen(open, { focusButton = false } = {}) {
  schemeOpen = open;
  renderSchemeMenu();
  const menu = document.getElementById("scheme-menu");
  if (open) (menu.querySelector('[aria-checked="true"]') || menu.querySelector(".scheme-opt"))?.focus();
  else if (focusButton) menu.querySelector(".scheme-btn")?.focus();
}

function wireSchemeMenu() {
  const menu = document.getElementById("scheme-menu");
  renderSchemeMenu();
  menu.addEventListener("click", (event) => {
    event.stopPropagation();   // the menu re-draws itself, so don't let "click outside" see this click
    const b = event.target.closest("button");
    if (!b) return;
    if (b.dataset.schemeToggle !== undefined) setSchemeOpen(!schemeOpen);
    else if (b.dataset.schemePick !== undefined) {
      applyScheme(b.dataset.schemePick);
      setSchemeOpen(false, { focusButton: true });
      showLabel(labelTarget());
    }
  });
  menu.addEventListener("keydown", (event) => {
    if (!schemeOpen) return;
    const opts = [...menu.querySelectorAll(".scheme-opt")];
    const i = opts.indexOf(document.activeElement);
    if (event.key === "Escape") { event.stopPropagation(); setSchemeOpen(false, { focusButton: true }); }
    else if (event.key === "ArrowDown") { event.preventDefault(); opts[(i + 1) % opts.length].focus(); }
    else if (event.key === "ArrowUp") { event.preventDefault(); opts[(i - 1 + opts.length) % opts.length].focus(); }
  });
  // Clicking anywhere else closes it.
  document.addEventListener("click", (event) => {
    if (schemeOpen && !menu.contains(event.target)) setSchemeOpen(false);
  });
}

function update() {
  const games = state.games;
  const count = (s) => games.filter((g) => g.status === s).length;
  const done = count("finished") + count("dropped");
  const totalHours = games.reduce((sum, g) => sum + g.hours, 0);
  const totalSessions = games.reduce((sum, g) => sum + g.sessions.length, 0);

  document.getElementById("summary").textContent = !games.length
    ? "Your backlog is empty. Add your first game, or import your Steam library."
    : `${done.toLocaleString()} of ${games.length.toLocaleString()} cleared · ${count("playing")} in progress · ${fmtHours(totalHours)} h played` +
    (totalSessions ? ` · ${totalSessions} session${totalSessions > 1 ? "s" : ""} logged` : "");

  renderShelf();

  document.getElementById("filters").innerHTML = [
    filterButton("all", `All ${games.length}`),
    filterButton("next", `★ Up next ${games.filter((g) => g.next).length}`),
    ...STATUSES.map((s) => filterButton(s, `${LABELS[s]} ${count(s)}`)),
  ].join("");

  // Filter by tab, platform and search text.
  const q = view.query.trim().toLowerCase();
  const visible = games
    .map((game, index) => ({ game, index }))
    .filter(({ game }) =>
      (view.filter === "all" || (view.filter === "next" ? game.next : game.status === view.filter)) &&
      (view.platform === "all" || game.platforms.includes(view.platform)) &&
      (!q || game.title.toLowerCase().includes(q) || game.genre.toLowerCase().includes(q) ||
        game.sessions.some((s) => s.note.toLowerCase().includes(q)))
    );

  // Sort. Ties fall back to title order.
  const byTitle = (a, b) => TITLE_ORDER.compare(a.game.title, b.game.title);
  const sorters = {
    shelf: (a, b) => a.index - b.index,
    title: byTitle,
    rating: (a, b) => b.game.rating - a.game.rating || byTitle(a, b),
    hours: (a, b) => b.game.hours - a.game.hours || byTitle(a, b),
    recent: (a, b) => lastPlayed(b.game).localeCompare(lastPlayed(a.game)) || byTitle(a, b),
    status: (a, b) => STATUS_ORDER[a.game.status] - STATUS_ORDER[b.game.status] || byTitle(a, b),
  };
  visible.sort(sorters[view.sort]);

  const emptyText = !games.length
    ? "No games yet. Use “Add a game” above, or “Import from Steam” to bring in your whole library."
    : q || view.platform !== "all"
    ? "No games match. Try a different search or platform."
    : "Nothing here yet. Change a game's status to fill this list.";
  renderList(visible, emptyText);
  followList();

  renderNav();
  if (page === "journal") renderJournal();
  else if (page === "completed") renderCompleted();
}

// ---------- THE LIST, drawn in pages ----------
// Big libraries would mean thousands of rows, so the list draws LIST_PAGE rows at a time
// and adds more as you scroll near the bottom. After a change, only rows whose content
// changed are redrawn.
const TITLE_ORDER = new Intl.Collator(undefined, { sensitivity: "base", numeric: true });
const LIST_PAGE = 60;
let listLimit = LIST_PAGE;
let lastVisible = [];              // every game the current tab/search/sort shows, in order
let rowHtml = [];                  // what each drawn row currently holds
let rowKeys = "";                  // which games are drawn, in order
let moreObserver = null;

function moreRowHtml(left) {
  return `<li class="more-row"><button type="button" data-more>Show ${Math.min(left, LIST_PAGE)} more <span>· ${left.toLocaleString()} left</span></button></li>`;
}

function renderList(visible, emptyText) {
  const list = document.getElementById("list");
  lastVisible = visible;
  if (!visible.length) {
    list.innerHTML = `<li class="empty">${emptyText}</li>`;
    rowHtml = []; rowKeys = "";
    return;
  }
  const shown = visible.slice(0, listLimit);
  const keys = shown.map((v) => v.index).join(",") + "|" + visible.length;
  const html = shown.map(gameRow);
  if (keys === rowKeys && list.children.length >= shown.length) {
    // Same games in the same order: swap only the rows that changed.
    for (let k = 0; k < html.length; k++) {
      if (html[k] !== rowHtml[k]) list.children[k].outerHTML = html[k];
    }
  } else {
    const left = visible.length - shown.length;
    list.innerHTML = html.join("") + (left > 0 ? moreRowHtml(left) : "");
  }
  rowHtml = html; rowKeys = keys;
  watchMoreRow();
}

// Add the next page of rows under the ones already drawn.
function showMore() {
  const list = document.getElementById("list");
  const from = listLimit;
  listLimit += LIST_PAGE;
  const add = lastVisible.slice(from, listLimit).map(gameRow);
  if (!add.length) return;
  list.querySelector(".more-row")?.remove();
  const left = lastVisible.length - listLimit;
  list.insertAdjacentHTML("beforeend", add.join("") + (left > 0 ? moreRowHtml(left) : ""));
  rowHtml = rowHtml.concat(add);
  rowKeys = lastVisible.slice(0, listLimit).map((v) => v.index).join(",") + "|" + lastVisible.length;
  watchMoreRow();
}

// Load the next page automatically when the "Show more" row comes near the screen.
function watchMoreRow() {
  if (!("IntersectionObserver" in window)) return;
  if (!moreObserver) {
    moreObserver = new IntersectionObserver((seen) => {
      if (seen.some((e) => e.isIntersecting) && page === "backlog") showMore();
    }, { rootMargin: "600px 0px" });
  }
  moreObserver.disconnect();
  const more = document.querySelector("#list .more-row");
  if (more) moreObserver.observe(more);
}

// Make sure a game's row is drawn (drawing further down the list if needed). Returns the row.
function ensureRow(i) {
  let row = document.querySelector(`#list li[data-index="${i}"]`);
  if (row) return row;
  const at = lastVisible.findIndex((v) => v.index === i);
  if (at < 0) return null;
  while (listLimit <= at) showMore();
  return document.querySelector(`#list li[data-index="${i}"]`);
}

// Start from the top of the list after changing what it shows.
function resetListPaging() { listLimit = LIST_PAGE; }

function filterButton(value, text) {
  return `<button data-filter="${value}" aria-pressed="${view.filter === value}">${text}</button>`;
}

// Closed rows are cached: a row is rebuilt only when something it shows has changed.
// (Rows with the journal open are always rebuilt; they show much more.)
const rowCache = new Map();   // game index -> { sig, html }
function gameRow(v) {
  const { game: g, index } = v;
  if (expanded.has(g.title)) return buildGameRow(v);
  const sig = [g.title, g.genre, g.status, g.next, g.hours, g.rating, g.platforms.join("/"), g.sessions.length,
    lastPlayed(g), index === highlighted, index === pendingRemove].join("|");
  const hit = rowCache.get(index);
  if (hit && hit.sig === sig) return hit.html;
  const html = buildGameRow(v);
  rowCache.set(index, { sig, html });
  return html;
}

// One row in the list. `index` is the game's position in state.games.
function buildGameRow({ game, index }) {
  const title = escapeHtml(game.title);
  const open = expanded.has(game.title);
  const n = game.sessions.length;
  return `
    <li class="${game.status}${index === highlighted ? " picked" : ""}" data-index="${index}">
      <button class="star" data-star="${index}" aria-pressed="${game.next}"
        aria-label="Mark ${title} as up next">★</button>
      <div class="info">
        <div class="headline">
          <span class="title">${title}${game.genre ? `<span class="genre">${escapeHtml(game.genre)}</span>` : ""}</span>
          ${game.hours > 0 ? `<span class="hrs">${fmtHours(game.hours)} h</span>` : ""}
        </div>
        ${game.platforms.length
          ? `<div class="tags">${game.platforms.map((p) => `<span class="tag">${p}</span>`).join("")}</div>`
          : ""}
        ${n ? `<div class="last">Last played ${fmtDate(lastPlayed(game))}</div>` : ""}
        <div class="status">
          ${STATUSES.map((s) => `
            <button data-game="${index}" data-status="${s}" aria-pressed="${game.status === s}">${LABELS[s]}</button>
          `).join("")}
        </div>
        <div class="row2">
          ${ratingStars(game, index)}
          <button class="more" data-toggle="${index}" aria-expanded="${open}">${open ? "Close journal" : n ? `Journal · ${n}` : "Journal"}</button>
          <button class="remove-link" data-remove="${index}" aria-label="Remove ${title} from the backlog">Remove</button>
        </div>
        ${pendingRemove === index ? `
          <div class="remove-confirm" role="alert">
            <span>Remove <strong>${title}</strong> from the backlog?${n ? ` Its ${n} journal entr${n > 1 ? "ies stay" : "y stays"} on the Journal page.` : ""}</span>
            <button class="no" data-remove-cancel="${index}">Keep it</button>
            <button class="yes" data-remove-confirm="${index}">Remove</button>
          </div>` : ""}
        ${open ? journalPanel(game, index) : ""}
      </div>
    </li>`;
}

// The journal: totals at the top, a form to log a session, then past entries.
function journalPanel(game, index) {
  const title = escapeHtml(game.title);
  const draft = drafts[game.title] || {};
  // Default platform: whatever you used last time, else the first one tagged.
  const plat = draft.platform ?? (game.sessions[0]?.platform || game.platforms[0] || "");
  const error = formErrors[game.title];
  return `
    <div class="details">
      <div>
        <p class="panel-label">Totals</p>
        <div class="totals">
          <label class="hours-field" for="hours-${index}">Total hours
            <input id="hours-${index}" data-hours="${index}" type="number" min="0" step="0.5"
              inputmode="decimal" placeholder="0" value="${game.hours || ""}"></label>
          <label class="hours-field" for="genre-${index}">Genre
            <select class="field" id="genre-${index}" data-genre="${index}">${genreOptions(game.genre)}</select></label>
          <div class="plats" role="group" aria-label="Platforms for ${title}">
            ${PLATFORMS.map((p) => `
              <button class="plat" data-game="${index}" data-plat="${p}" aria-pressed="${game.platforms.includes(p)}">${p}</button>
            `).join("")}
          </div>
        </div>
      </div>

      <form class="log" data-log="${index}" aria-label="Log a session for ${title}">
        <p class="panel-label">Log a session</p>
        <div class="log-fields">
          <label class="sr" for="log-date-${index}">Date</label>
          <input class="field" id="log-date-${index}" name="date" type="date" value="${escapeHtml(draft.date || today())}">
          <label class="sr" for="log-time-${index}">Time</label>
          <input class="field" id="log-time-${index}" name="time" type="time" value="${escapeHtml(draft.time || nowTime())}">
          <label class="sr" for="log-hours-${index}">Hours this session</label>
          <input class="field f-hours" id="log-hours-${index}" name="hours" type="number" min="0" step="0.25"
            inputmode="decimal" placeholder="Hours" value="${escapeHtml(draft.hours || "")}">
          <label class="sr" for="log-platform-${index}">Played on</label>
          <select class="field f-platform" id="log-platform-${index}" name="platform">
            <option value="">No platform</option>
            ${PLATFORMS.map((p) => `<option value="${p}" ${p === plat ? "selected" : ""}>${p}</option>`).join("")}
          </select>
        </div>
        <div class="moods" role="group" aria-label="How did the session feel?">
          ${Object.entries(MOODS).map(([m, label]) => `
            <button type="button" class="mood m-${m}" data-game="${index}" data-mood="${m}"
              aria-pressed="${draft.mood === m}">${faceSvg(m)}${label}</button>
          `).join("")}
        </div>
        <label class="sr" for="log-note-${index}">Notes</label>
        <textarea class="field" id="log-note-${index}" name="note"
          placeholder="How did it go? Where did you leave off?">${escapeHtml(draft.note || "")}</textarea>
        ${formMediaHtml(draft.media || [], "log:" + game.title, `data-scope="log" data-title="${title}"`)}
        <div class="log-actions">
          <span class="hint ${error ? "error" : ""}">${error || "Hours and platform add to this game's totals."}</span>
          <button class="add" type="submit">Add entry</button>
        </div>
      </form>

      ${game.sessions.length ? `
        <div>
          <p class="panel-label">Entries</p>
          <div class="entries">${game.sessions.map((s) => entryHtml(s, index)).join("")}</div>
        </div>` : ""}
    </div>`;
}

function entryHtml(s, index) {
  const bits = [s.hours ? `${fmtHours(s.hours)} h played` : "", escapeHtml(s.platform)].filter(Boolean).join(" · ");
  const confirming = pendingDelete === s.id;
  const isEditing = editing?.id === s.id;
  // Keep it open while confirming a delete or editing, so nothing vanishes.
  const open = openEntries.has(s.id) || confirming || isEditing;
  return `
    <details class="entry" data-entry="${s.id}" ${open ? "open" : ""}>
      <summary class="entry-sum">
        <span class="entry-date">${fmtDate(s.date)}</span>
        ${s.time ? `<span class="entry-time">${fmtTime(s.time)}</span>` : ""}
        ${MOODS[s.mood] ? `<span class="entry-mood m-${s.mood}">${faceSvg(s.mood)}${MOODS[s.mood]}</span>` : ""}
        ${s.edited ? `<span class="edited-flag">edited</span>` : ""}
        ${mediaCountHtml(s.media)}
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="entry-body">
        ${isEditing ? editForm(s, index) : `
        <div class="entry-meta">
          <span>${bits || "No hours or platform logged"}</span>
          <span class="entry-actions">
            <button class="del" data-game="${index}" data-edit-entry="${s.id}">Edit</button>
            <button class="del ${confirming ? "confirm" : ""}" data-game="${index}" data-del="${s.id}">${confirming ? "Confirm delete" : "Delete"}</button>
          </span>
        </div>
        ${s.note ? `<p class="entry-note">${escapeHtml(s.note)}</p>` : ""}
        ${mediaGridHtml(s)}
        ${stampLine(s)}`}
      </div>
    </details>`;
}

// "Logged Sep 29, 1:29 AM · Last edited Sep 29, 9:30 PM"
function stampLine(s) {
  const logged = fmtStamp(createdAt(s));
  const edited = s.edited ? fmtStamp(new Date(s.edited)) : "";
  if (!logged && !edited) return "";
  return `<p class="stamps">${logged ? `Logged ${logged}` : ""}${logged && edited ? " · " : ""}${edited ? `Last edited ${edited}` : ""}</p>`;
}

// Editing an entry: the same fields as "Log a session", filled in from `editing`.
function editForm(s, index) {
  const e = editing;
  const id = s.id;
  return `
    <form class="log edit-form" data-edit="${id}" data-game="${index}" aria-label="Edit entry">
      <div class="log-fields">
        <label class="sr" for="edit-date-${id}">Date</label>
        <input class="field" id="edit-date-${id}" name="date" type="date" value="${escapeHtml(e.date)}">
        <label class="sr" for="edit-time-${id}">Time</label>
        <input class="field" id="edit-time-${id}" name="time" type="time" value="${escapeHtml(e.time)}">
        <label class="sr" for="edit-hours-${id}">Hours this session</label>
        <input class="field f-hours" id="edit-hours-${id}" name="hours" type="number" min="0" step="0.25"
          inputmode="decimal" placeholder="Hours" value="${escapeHtml(e.hours)}">
        <label class="sr" for="edit-platform-${id}">Played on</label>
        <select class="field f-platform" id="edit-platform-${id}" name="platform">
          <option value="">No platform</option>
          ${PLATFORMS.map((p) => `<option value="${p}" ${p === e.platform ? "selected" : ""}>${p}</option>`).join("")}
        </select>
      </div>
      <div class="moods" role="group" aria-label="How did the session feel?">
        ${Object.entries(MOODS).map(([m, label]) => `
          <button type="button" class="mood m-${m}" data-game="${index}" data-edit-mood="${m}"
            aria-pressed="${e.mood === m}">${faceSvg(m)}${label}</button>
        `).join("")}
      </div>
      <label class="sr" for="edit-note-${id}">Notes</label>
      <textarea class="field" id="edit-note-${id}" name="note" placeholder="How did it go?">${escapeHtml(e.note)}</textarea>
      ${formMediaHtml(e.media || [], "edit:" + id, `data-scope="edit"`)}
      <div class="log-actions">
        <span class="hint">Changing hours updates the game's total.</span>
        <span class="edit-buttons">
          <button type="button" class="cancel" data-cancel-edit="${id}">Cancel</button>
          <button class="add" type="submit">Save changes</button>
        </span>
      </div>
    </form>`;
}

// When an entry was first logged. Newer entries store it; older ones get it back
// from their id, which starts with the moment they were created.
function createdAt(s) {
  if (s.created) return new Date(s.created);
  const t = parseInt(s.id.slice(0, -4), 36);
  return isFinite(t) && t > 0 ? new Date(t) : null;
}
function fmtStamp(date) {
  if (!date || isNaN(date)) return "";
  const opts = { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
  if (date.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return date.toLocaleString(undefined, opts);
}

// "20:15" -> "8:15 PM" (or 24-hour, depending on your device's settings)
function fmtTime(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return new Date(2000, 0, 1, h, m).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

// A small face drawn in SVG. Only the mouth (and brows for angry) changes between moods.
function faceSvg(mood) {
  const mouths = {
    happy: "M8 14 Q12 18 16 14",
    meh:   "M8.5 15 H15.5",
    sad:   "M8 16.5 Q12 12.5 16 16.5",
    angry: "M8.5 16.5 Q12 13.5 15.5 16.5",
  };
  const brows = mood === "angry" ? `<path d="M7 7.5 L10.5 9.3 M17 7.5 L13.5 9.3"/>` : "";
  return `<svg class="face" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="10"/>
    <circle class="eye" cx="9" cy="10.3" r="1.3"/><circle class="eye" cx="15" cy="10.3" r="1.3"/>
    ${brows}<path d="${mouths[mood]}"/></svg>`;
}

// Five stars. Each star has two invisible buttons: the left half sets x.5, the right half sets x.
// Clicking the rating a game already has clears it.
function ratingStars(game, index) {
  let html = `<span class="rating" role="group" aria-label="Rating for ${escapeHtml(game.title)}">`;
  for (let n = 1; n <= 5; n++) {
    const fill = game.rating >= n ? "full" : game.rating >= n - 0.5 ? "half" : "";
    html += `<span class="rs ${fill}">
      <button data-game="${index}" data-rate="${n - 0.5}" aria-label="${n - 0.5} stars" title="${n - 0.5}"></button>
      <button data-game="${index}" data-rate="${n}" aria-label="${n} star${n > 1 ? "s" : ""}" title="${n}"></button>
    </span>`;
  }
  return html + `</span><span class="rating-num">${game.rating ? game.rating.toFixed(1) + " / 5" : "Not rated"}</span>`;
}

function fmtHours(h) {
  return (Math.round(h * 10) / 10).toLocaleString();
}

// Stops titles with symbols like < or & from breaking the page.
function escapeHtml(text) {
  return text.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ============================================================
// JOURNAL ENTRIES: shared by the Backlog and Journal pages.
// An entry lives in its game's `sessions`, or in `state.archive` if its game was removed.
// ============================================================
function findEntry(id) {
  for (const game of state.games) {
    const entry = game.sessions.find((s) => s.id === id);
    if (entry) return { entry, game };
  }
  const entry = state.archive.find((s) => s.id === id);
  return entry ? { entry, game: null } : null;
}

const sortSessions = (list) =>
  list.sort((a, b) => b.date.localeCompare(a.date) || (b.time || "").localeCompare(a.time || ""));

// Save an edited entry from an edit form. Hours and platform keep the game's totals in step.
function applyEntryEdit(id, f, mood, media) {
  const found = findEntry(id);
  if (!found) return false;
  const { entry, game } = found;
  let hours = parseFloat(f.hours.value);
  if (!isFinite(hours) || hours < 0) hours = 0;
  hours = Math.round(hours * 100) / 100;
  if (game) game.hours = Math.max(0, Math.round((game.hours - (entry.hours || 0) + hours) * 100) / 100);
  entry.hours = hours;
  if (/^\d{4}-\d{2}-\d{2}$/.test(f.date.value)) entry.date = f.date.value;
  entry.time = /^\d{2}:\d{2}$/.test(f.time.value) ? f.time.value : "";
  entry.platform = PLATFORMS.includes(f.platform.value) ? f.platform.value : "";
  entry.mood = MOODS[mood] ? mood : "";
  entry.note = f.note.value.trim();
  if (media) {
    // Photos or videos taken off this entry are deleted from storage for good.
    const keep = new Set(media.map((m) => m.id));
    (entry.media || []).forEach((m) => { if (!keep.has(m.id)) deleteAsset(m.id); });
    entry.media = [...media];
  }
  if (!entry.created) { const c = createdAt(entry); if (c) entry.created = c.toISOString(); }
  entry.edited = new Date().toISOString();
  if (game) {
    if (entry.platform && !game.platforms.includes(entry.platform)) {
      game.platforms = PLATFORMS.filter((p) => p === entry.platform || game.platforms.includes(p));
    }
    sortSessions(game.sessions);
  }
  return true;
}

// Delete an entry for good. A live game's total hours drop by that session's hours.
function deleteEntry(id) {
  const found = findEntry(id);
  if (!found) return;
  const { entry, game } = found;
  (entry.media || []).forEach((m) => deleteAsset(m.id));   // its photos and videos go too
  if (game) {
    game.sessions = game.sessions.filter((s) => s.id !== id);
    game.hours = Math.max(0, Math.round((game.hours - (entry.hours || 0)) * 100) / 100);
  } else {
    state.archive = state.archive.filter((s) => s.id !== id);
  }
  openEntries.delete(id); saveOpenEntries();
}

// Start editing an entry: copy it into `editing` so changes can be cancelled.
function startEdit(id) {
  const found = findEntry(id);
  if (!found) return false;
  const s = found.entry;
  discardEditUploads();   // leaving another edit unsaved
  editing = { id: s.id, date: s.date, time: s.time || "", hours: s.hours ? String(s.hours) : "",
              platform: s.platform || "", mood: s.mood || "", note: s.note || "",
              media: [...(s.media || [])], origMedia: (s.media || []).map((m) => m.id) };
  return true;
}

// ============================================================
// 3. INPUT: clicks, dropdowns, typing
// ============================================================
app.addEventListener("click", (event) => {
  const button = event.target.closest("button");
  if (!button) return;
  const d = button.dataset;
  if (d.spine !== undefined) {
    if (Date.now() < touchClickGuard) return;   // a touch on the shelf was already handled
    jumpTo(Number(d.spine));
    return;
  }
  if (d.more !== undefined) { showMore(); return; }
  const wasPending = pendingDelete || pendingRemove != null;
  if (d.del === undefined) pendingDelete = null;
  if (d.remove === undefined && d.removeConfirm === undefined) pendingRemove = null;

  if (d.remove !== undefined) {
    // First step: ask for confirmation right under the game.
    pendingRemove = Number(d.remove);
    update();
    app.querySelector(`[data-remove-cancel="${d.remove}"]`)?.focus({ preventScroll: true });
    return;
  } else if (d.removeCancel !== undefined) {
    update();
    app.querySelector(`[data-remove="${d.removeCancel}"]`)?.focus({ preventScroll: true });
    return;
  } else if (d.removeConfirm !== undefined) {
    removeGame(Number(d.removeConfirm));
    return;
  } else if (d.del !== undefined) {
    if (pendingDelete !== d.del) {
      pendingDelete = d.del;   // first click asks for confirmation
    } else {
      deleteEntry(d.del);   // also takes that session's hours back off the total
      pendingDelete = null;
      save();
    }
  } else if (d.editEntry) {
    // Start editing: copy the entry into `editing` so changes can be cancelled.
    if (!startEdit(d.editEntry)) return;
    openEntries.add(d.editEntry);
    saveOpenEntries();
    update();
    document.getElementById(`edit-note-${d.editEntry}`)?.focus();
    return;
  } else if (d.editMood) {
    if (editing) editing.mood = editing.mood === d.editMood ? "" : d.editMood;
    button.parentElement.querySelectorAll("[data-edit-mood]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.editMood === editing?.mood)));
    return;
  } else if (d.cancelEdit) {
    discardEditUploads();
    editing = null;
    update();
    app.querySelector(`button[data-edit-entry="${CSS.escape(d.cancelEdit)}"]`)?.focus({ preventScroll: true });
    return;
  } else if (d.mood) {
    // Pick a mood for the session being written; tap it again to clear.
    // Only the four mood buttons change, so flip them in place instead of redrawing the row.
    const t = state.games[d.game].title;
    const draft = drafts[t] || {};
    drafts[t] = { ...draft, mood: draft.mood === d.mood ? "" : d.mood };
    saveDrafts();
    button.parentElement.querySelectorAll("[data-mood]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mood === drafts[t].mood)));
    return;
  } else if (d.filter) {
    view.filter = d.filter;
    resetListPaging();
    saveView();
  } else if (d.star !== undefined) {
    const game = state.games[d.star];
    game.next = !game.next;
    save();
  } else if (d.toggle !== undefined) {
    const t = state.games[d.toggle].title;
    expanded.has(t) ? expanded.delete(t) : expanded.add(t);
    saveOpen();
  } else if (d.rate) {
    const game = state.games[d.game];
    const value = Number(d.rate);
    game.rating = game.rating === value ? 0 : value;
    save();
  } else if (d.plat) {
    const game = state.games[d.game];
    const on = !game.platforms.includes(d.plat);
    // Keep platforms in a consistent order.
    game.platforms = PLATFORMS.filter((p) => (p === d.plat ? on : game.platforms.includes(p)));
    save();
  } else if (d.status) {
    setStatus(state.games[d.game], d.status);
    save();
  } else {
    if (wasPending) update();   // clicking elsewhere cancels a pending delete
    return;
  }

  // The list is redrawn, so put keyboard focus back on the same button.
  const key = [...button.attributes]
    .filter((a) => a.name.startsWith("data-"))
    .map((a) => `[${a.name}="${CSS.escape(a.value)}"]`)
    .join("");
  update();
  // Keyboard users keep their place on the redrawn button. (A mouse or finger doesn't need
  // it, and skipping it saves the browser an extra layout pass.)
  if (key && event.detail === 0) app.querySelector("button" + key)?.focus({ preventScroll: true });
});

app.addEventListener("change", (event) => {
  const t = event.target;
  if (t.id === "sort") {
    view.sort = t.value; saveView(); resetListPaging(); update();
  } else if (t.id === "platform-filter") {
    view.platform = t.value; saveView(); resetListPaging(); update();
  } else if (t.dataset.genre !== undefined) {
    const g = state.games[t.dataset.genre];
    if (g) { g.genre = t.value; save(); update(); document.getElementById(t.id)?.focus({ preventScroll: true }); }
  } else if (t.dataset.hours !== undefined) {
    let value = parseFloat(t.value);
    if (!isFinite(value) || value < 0) value = 0;
    state.games[t.dataset.hours].hours = Math.round(value * 10) / 10;
    save();
    update();
  }
});

let searchTimer = null;
app.addEventListener("input", (event) => {
  if (event.target.id === "search") {
    // Wait for a short pause in typing, so big libraries don't redraw on every key.
    view.query = event.target.value;
    saveView();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { resetListPaging(); update(); }, state.games.length > 300 ? 180 : 60);
    return;
  }
  // Typing in a log form: keep a draft so nothing is lost if the list redraws.
  // Typing in an edit form: keep the changes in `editing`.
  const editFormEl = event.target.closest("form[data-edit]");
  if (editFormEl && editing) {
    const f = editFormEl.elements;
    Object.assign(editing, { date: f.date.value, time: f.time.value, hours: f.hours.value,
                             platform: f.platform.value, note: f.note.value });
    return;
  }
  const form = event.target.closest("form[data-log]");
  if (form) {
