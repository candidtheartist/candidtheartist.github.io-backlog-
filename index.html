    const game = state.games[form.dataset.log];
    const f = form.elements;
    drafts[game.title] = { ...drafts[game.title], date: f.date.value, time: f.time.value, hours: f.hours.value, platform: f.platform.value, note: f.note.value };
    saveDraftsSoon();   // typing stays instant; the draft is stored a moment after you pause
  }
});

// Remember which entries you've expanded. ("toggle" doesn't bubble, so listen in the capture phase.)
app.addEventListener("toggle", (event) => {
  const el = event.target;
  if (!el.matches?.("details[data-entry]")) return;
  el.open ? openEntries.add(el.dataset.entry) : openEntries.delete(el.dataset.entry);
  saveOpenEntries();
}, true);

// Ctrl/Cmd + Enter in the notes box adds the entry.
app.addEventListener("keydown", (event) => {
  // Escape (outside a form) clears the shelf highlight.
  if (event.key === "Escape" && highlighted != null && !event.target.closest("form")) {
    highlighted = null;
    document.querySelectorAll("#list li.picked").forEach((el) => el.classList.remove("picked"));
    shelfEl().children[selected]?.classList.remove("selected");
    if (spineDrawn[selected]) spineDrawn[selected].sel = false;
    selected = null;
    showLabel(labelTarget());
  }
  // Escape while editing an entry cancels the edit.
  if (event.key === "Escape" && editing && event.target.closest("form[data-edit]")) {
    event.target.closest("form[data-edit]").querySelector("[data-cancel-edit]").click();
    return;
  }
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey) && event.target.name === "note") {
    event.preventDefault();
    event.target.form.requestSubmit();
  }
});

// "Add entry": save the session, add its hours and platform to the game's totals.
app.addEventListener("submit", (event) => {
  // "Save changes" on an edited entry.
  const editFormEl = event.target.closest("form[data-edit]");
  if (editFormEl) {
    event.preventDefault();
    if ((uploading["edit:" + editFormEl.dataset.edit] || 0) > 0) return;   // still uploading
    if (applyEntryEdit(editFormEl.dataset.edit, editFormEl.elements, editing?.mood, editing?.media)) save();
    editing = null;
    update();
    return;
  }

  const form = event.target.closest("form[data-log]");
  if (!form) return;
  event.preventDefault();
  const index = Number(form.dataset.log);
  const game = state.games[index];
  const f = form.elements;

  let hours = parseFloat(f.hours.value);
  if (!isFinite(hours) || hours < 0) hours = 0;
  hours = Math.round(hours * 100) / 100;
  const note = f.note.value.trim();
  const date = /^\d{4}-\d{2}-\d{2}$/.test(f.date.value) ? f.date.value : today();
  const platform = PLATFORMS.includes(f.platform.value) ? f.platform.value : "";
  const pickedMood = drafts[game.title]?.mood;
  const mood = MOODS[pickedMood] ? pickedMood : "";

  const media = drafts[game.title]?.media || [];
  if ((uploading["log:" + game.title] || 0) > 0) {
    formErrors[game.title] = "Hang on, photos or videos are still uploading.";
    update();
    return;
  }
  if (!note && !hours && !mood && !media.length) {
    formErrors[game.title] = "Add some hours, a mood, a note or a photo first.";
    update();
    document.getElementById(`log-note-${index}`)?.focus();
    return;
  }
  delete formErrors[game.title];

  const time = /^\d{2}:\d{2}$/.test(f.time.value) ? f.time.value : "";
  game.sessions.unshift({ id: newId(), date, time, hours, platform, mood, note, media: [...media], created: new Date().toISOString() });
  // Newest first by date, then time; entries without a time keep their order.
  game.sessions.sort((a, b) => b.date.localeCompare(a.date) || (b.time || "").localeCompare(a.time || ""));
  game.hours = Math.round((game.hours + hours) * 100) / 100;
  if (platform && !game.platforms.includes(platform)) {
    game.platforms = PLATFORMS.filter((p) => p === platform || game.platforms.includes(p));
  }
  if (game.status === "backlog") game.status = "playing";   // logging a session means you've started it

  delete drafts[game.title];
  saveDrafts();
  save();
  update();
});

// ============================================================
// 3b. THE SHELF: Dock-style magnify on hover, name underneath, bounce on select
//     Small libraries: every spine fits across the shelf.
//     Big libraries: spines keep a fixed width and the shelf scrolls sideways
//     (drag on touch, trackpad swipe, or the mouse wheel while over the shelf).
// ============================================================
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

let selected = null;   // selected game: its spine sits raised (row clicked or spine clicked)
let hovered = null;    // spine under the pointer or keyboard focus right now
// Ignore row hovers/focus briefly: right after the page loads (so a restored focus
// doesn't pick a game) and while the list scrolls after a jump.
let quietUntil = Date.now() + 1000;

const shelfEl = () => document.getElementById("shelf");
const scrollerEl = () => document.getElementById("shelf-scroll");

const SPINE_W = 20;      // spine width on a scrolling shelf (px)
const FIT_GAP = 3;       // space between spines on a shelf that fits
const SCROLL_GAP = 4;    // ...and on a scrolling shelf
const gapNow = () => (scrollMode ? SCROLL_GAP : FIT_GAP);
const MIN_FIT_W = 14;     // narrower than this, and the shelf switches to scrolling
let scrollMode = false;

// Pick fit or scroll mode for the current number of games and screen width.
// Cached shelf geometry, so animations can place things with arithmetic instead of
// asking the browser to measure (measuring mid-animation forces a full page layout).
let shelfViewW = 0;   // visible width of the shelf
let shelfX = 0;       // how far the shelf is scrolled sideways
let labelW = 0;       // width of the name area above the shelf (0 = measure again)
function setShelfX(x) { scrollerEl().scrollLeft = x; shelfX = x; }

function setShelfMode() {
  const scroller = scrollerEl();
  const n = state.games.length;
  shelfViewW = scroller.clientWidth;
  const fits = n * (MIN_FIT_W + FIT_GAP) <= shelfViewW && n * (40 + FIT_GAP) >= shelfViewW;
  document.querySelector(".shelf-wrap").classList.toggle("no-games", !n);
  if (scrollMode === !fits) return;
  scrollMode = !fits;
  shelfEl().classList.toggle("scroll", scrollMode);
  scroller.classList.toggle("scrolls", scrollMode);
  resetWave();
  updateEdges();
}

// Fade the ends of a scrolling shelf when there's more to see that way.
function updateEdges() {
  const s = scrollerEl();
  const maxX = state.games.length * (SPINE_W + SCROLL_GAP) - SCROLL_GAP - shelfViewW;   // arithmetic, no measuring
  const left = scrollMode && shelfX > 2, right = scrollMode && shelfX < maxX - 2;
  if (s.classList.contains("more-left") !== left) s.classList.toggle("more-left", left);
  if (s.classList.contains("more-right") !== right) s.classList.toggle("more-right", right);
}

const spineDrawn = [];   // what each spine currently shows: { s: status, label, sel, ti }
// Build the spines when the number of games changes; otherwise only touch what changed,
// so animations aren't restarted and big shelves stay quick.
function renderShelf() {
  const shelf = shelfEl();
  const games = state.games;
  if (shelf.children.length !== games.length) {
    shelf.innerHTML = games.map((g, i) => `<button class="spine" data-spine="${i}" tabindex="-1"></button>`).join("");
    spineDrawn.length = 0;
    resetWave();
  }
  setShelfMode();
  // Compare against what we last drew (kept in plain arrays), so an update that doesn't touch
  // the shelf doesn't have to read a thousand spines back from the page.
  const focusable = selected ?? 0;
  for (let i = 0; i < games.length; i++) {
    const g = games[i];
    const drawn = spineDrawn[i] || (spineDrawn[i] = { s: "", label: "", sel: false, ti: -2 });
    const label = `${g.title}, ${LABELS[g.status]}`;
    const sel = i === selected;
    const ti = i === focusable ? 0 : -1;
    if (drawn.s === g.status && drawn.label === label && drawn.sel === sel && drawn.ti === ti) continue;
    const el = shelf.children[i];
    if (drawn.s !== g.status) { if (drawn.s) el.classList.remove(drawn.s); el.classList.add(g.status); el.dataset.s = g.status; }
    if (drawn.label !== label) el.setAttribute("aria-label", label);
    if (drawn.sel !== sel) el.classList.toggle("selected", sel);
    if (drawn.ti !== ti) el.tabIndex = ti;
    Object.assign(drawn, { s: g.status, label, sel, ti });
  }
  showLabel(labelTarget());
}

// The Dock effect. Each spine has a target size from a bell curve centred on the
// pointer; every frame the real size eases toward that target, which is what
// gives the smooth, springy feel as you sweep across. Only spines near the pointer
// (or still settling) are touched, so a shelf of thousands costs the same as a few dozen.
const MAG_WIDTH = 3;     // the spine under the pointer gets up to 3x wider (fitted shelf only)...
const MAG_HEIGHT = 1.4;  // ...and 1.4x taller
const RISE = 14;         // px the spine under the pointer lifts; neighbours lift a little less
const REACH = 1.7;       // how many neighbours on each side are pulled along
const EASE = 0.25;       // 0–1: how quickly sizes catch up (higher = snappier)
const WINDOW = 8;        // spines further than this from the pointer are at rest

let pointerX = null;     // where the pointer is on the shelf (null = not on it)
const sizes = new Map(); // spine index -> current { w, h, r } for spines not at rest
let animating = false;

function resetWave() {
  const shelf = shelfEl();
  sizes.forEach((_, i) => {
    const el = shelf.children[i];
    if (el) { el.style.flexGrow = ""; el.style.removeProperty("--mag"); el.style.removeProperty("--rise"); }
  });
  sizes.clear();
}

function wave(x) {
  pointerX = x;
  if (!animating) { animating = true; requestAnimationFrame(step); }
}

// Size of one un-magnified slot, and where the shelf starts on screen.
function shelfGeometry() {
  const shelf = shelfEl();
  const rect = shelf.getBoundingClientRect();
  const n = shelf.children.length || 1;
  return { rect, n, slot: scrollMode ? SPINE_W + SCROLL_GAP : (rect.width + FIT_GAP) / n };
}

function step() {
  const shelf = shelfEl();
  const spines = shelf.children;
  const { rect, n, slot } = shelfGeometry();
  const instant = reduceMotion.matches;
  let moving = false;

  // Spines to visit: the ones near the pointer, plus any still settling.
  const visit = new Set(sizes.keys());
  if (pointerX != null) {
    const c = Math.floor((pointerX - rect.left) / slot);
    for (let i = Math.max(0, c - WINDOW); i <= Math.min(n - 1, c + WINDOW); i++) visit.add(i);
  }

  visit.forEach((i) => {
    const el = spines[i];
    if (!el) { sizes.delete(i); return; }
    let tw = 1, th = 1, tr = 0;
    if (pointerX != null) {
      // Distance measured on the un-magnified layout, so the effect never jitters.
      const d = (pointerX - (rect.left + (i + 0.5) * slot)) / slot;
      if (instant) {
        if (Math.abs(d) < 0.5) { th = 1.2; tr = RISE / 2; }   // reduced motion: just raise the one spine
      } else if (Math.abs(d) <= WINDOW) {
        const g = Math.exp(-(d * d) / (2 * REACH * REACH));
        tw = scrollMode ? 1 : 1 + (MAG_WIDTH - 1) * g;   // a scrolling shelf only grows upward
        th = 1 + (MAG_HEIGHT - 1) * g;
        tr = RISE * g;
      }
    }
    const c = sizes.get(i) || { w: 1, h: 1, r: 0 };
    const k = instant ? 1 : EASE;
    c.w += (tw - c.w) * k;
    c.h += (th - c.h) * k;
    c.r += (tr - c.r) * k;
    const settled = Math.abs(tw - c.w) <= 0.002 && Math.abs(th - c.h) <= 0.002 && Math.abs(tr - c.r) <= 0.05;
    if (settled) { c.w = tw; c.h = th; c.r = tr; } else moving = true;
    if (settled && tw === 1 && th === 1 && tr === 0) {
      // Back at rest: hand the spine back to the stylesheet.
      sizes.delete(i);
      el.style.flexGrow = ""; el.style.removeProperty("--mag"); el.style.removeProperty("--rise");
      return;
    }
    sizes.set(i, c);
    el.style.flexGrow = scrollMode ? "" : c.w.toFixed(3);
    el.style.setProperty("--mag", c.h.toFixed(3));
    el.style.setProperty("--rise", c.r.toFixed(1) + "px");
  });

  if (hovered != null) showLabel(hovered);   // keep the name under the moving spine
  if (moving) requestAnimationFrame(step);
  else { animating = false; if (hovered == null) showLabel(labelTarget()); }
}

// Which spine is under this x position?
function spineAt(x) {
  const spines = shelfEl().children;
  const { rect, n, slot } = shelfGeometry();
  const guess = Math.max(0, Math.min(n - 1, Math.floor((x - rect.left) / slot)));
  if (scrollMode) return guess;   // spines keep their width, so the guess is exact
  // Fitted shelf: magnified spines push others aside, so check the real edges nearby.
  let best = guess, bestDist = Infinity;
  for (let i = Math.max(0, guess - WINDOW); i <= Math.min(n - 1, guess + WINDOW); i++) {
    const r = spines[i].getBoundingClientRect();
    if (x >= r.left - 1.5 && x <= r.right + 1.5) return i;
    const dist = Math.min(Math.abs(x - r.left), Math.abs(x - r.right));
    if (dist < bestDist) { best = i; bestDist = dist; }
  }
  return best;
}

// Show a game's name under its spine (or a hint when nothing is picked).
// Which game the name above the shelf shows: the spine under your pointer or finger; otherwise,
// in Follow mode, the game at the top of the list (unless you've just picked one on the shelf).
let followCurrent = null, lastPickAt = 0, lastListScrollAt = 0;
function labelTarget() {
  if (hovered != null) return hovered;
  if (shelfPrefs.mode === "follow" && followCurrent != null && page === "backlog" &&
      (selected == null || lastListScrollAt > lastPickAt)) return followCurrent;
  return selected;
}

// Where a spine's centre is, measured from the left edge of the shelf (the name area above
// and the arrow below start at the same edge). A scrolling shelf's spines never change width,
// so this is plain arithmetic there.
function spineCenterX(i) {
  if (scrollMode) return i * (SPINE_W + SCROLL_GAP) + SPINE_W / 2 - shelfX;
  const s = shelfEl().children[i]?.getBoundingClientRect();
  return s ? s.left + s.width / 2 - scrollerEl().getBoundingClientRect().left : -1;
}

let labelKey = "";   // what the name area currently shows, so it's only rebuilt when that changes
let textW = 0;       // width of the current name text

function showLabel(i) {
  const label = document.getElementById("shelf-label");
  const caret = label.firstElementChild.nextElementSibling;
  const text = label.firstElementChild;
  if (i == null || !state.games[i]) {
    const hint = !state.games.length
      ? "Your shelf fills up as you add games"
      : scrollMode
      ? `${state.games.length.toLocaleString()} games · ${shelfHint()}`
      : matchMedia("(pointer: coarse)").matches
        ? (shelfPrefs.mode === "follow" ? "Follows the list as you scroll · tap a spine twice to open it" : "Drag across the shelf · tap a spine twice to open it")
        : "Hover or drag across the shelf · click a spine to jump to that game";
    if (labelKey !== "idle:" + hint) {
      labelKey = "idle:" + hint;
      label.classList.add("idle");
      text.textContent = hint;
      text.style.left = "0px";
    }
    return;
  }
  const g = state.games[i];
  const key = [i, g.title, g.genre, g.status, g.hours, g.rating].join("|");
  if (key !== labelKey) {
    labelKey = key;
    label.classList.remove("idle");
    text.innerHTML = `<strong>${escapeHtml(g.title)}</strong>` +
      (g.genre ? ` <span class="lbl-genre">${escapeHtml(g.genre)}</span>` : "") +
      ` <span class="lbl-status ${g.status}">${LABELS[g.status]}</span>` +
      (g.hours ? ` <span class="lbl-meta">· ${fmtHours(g.hours)} h</span>` : "") +
      (g.rating ? ` <span class="lbl-meta">· ★ ${g.rating.toFixed(1)}</span>` : "");
    textW = text.offsetWidth;   // measured only when the text changes
  }
  if (!labelW) labelW = label.clientWidth;
  const center = spineCenterX(i);
  caret.style.visibility = center < 0 || center > labelW ? "hidden" : "";   // spine scrolled out of view
  caret.style.left = center + "px";
  text.style.left = Math.max(0, Math.min(center - textW / 2, labelW - textW)) + "px";
}

// On a scrolling shelf, bring a spine into view (without moving the page).
function revealSpine(i, smooth = true) {
  if (!scrollMode) return;
  const s = scrollerEl();
  const left = i * (SPINE_W + SCROLL_GAP);
  const margin = 40;
  if (left >= s.scrollLeft + margin && left + SPINE_W <= s.scrollLeft + s.clientWidth - margin) return;
  s.scrollTo({ left: left - s.clientWidth / 2 + SPINE_W / 2, behavior: smooth && !reduceMotion.matches ? "smooth" : "auto" });
}

// Pick a game: its spine pops up with a bounce.
function select(i, { force = false, reveal = true } = {}) {
  lastPickAt = performance.now();
  if (i === selected && !force) { showLabel(labelTarget()); return; }
  const spines = shelfEl().children;
  spines[selected]?.classList.remove("selected");
  if (spines[selected]) spines[selected].tabIndex = -1;
  if (spineDrawn[selected]) Object.assign(spineDrawn[selected], { sel: false, ti: -1 });
  if (spineDrawn[i]) Object.assign(spineDrawn[i], { sel: true, ti: 0 });
  selected = i;
  const el = spines[i];
  if (el) {
    // Restart the bounce: take the class off, put it back next frame (no forced layout).
    el.classList.remove("selected");
    el.tabIndex = 0;
    requestAnimationFrame(() => { if (selected === i) el.classList.add("selected"); });
  }
  if (reveal) revealSpine(i);
  if (hovered == null) showLabel(i);
}

// Highlight one game's row in the list (and un-highlight the previous one).
function highlightRow(i) {
  highlighted = i;
  document.querySelectorAll("#list li.picked").forEach((el) => el.classList.remove("picked"));
  document.querySelector(`#list li[data-index="${i}"]`)?.classList.add("picked");
}

// Select a game from the list: raise its spine and highlight its row, no scrolling.
function pick(i) {
  select(i);
  highlightRow(i);
}

// Click a spine: bounce it and scroll to that game in the list.
function jumpTo(i) {
  select(i, { force: true });
  let row = ensureRow(i);
  if (!row) {
    // The game is hidden by a search or filter, so clear them.
    Object.assign(view, { filter: "all", platform: "all", query: "" });
    document.getElementById("search").value = "";
    document.getElementById("platform-filter").value = "all";
    saveView();
    listLimit = LIST_PAGE;
    update();
    row = ensureRow(i);
  }
  if (!row) return;
  highlightRow(i);
  quietUntil = Date.now() + 900;
  // Nearby rows glide into view. Far away, rows in between haven't been drawn yet (their
  // heights are estimates), so jump straight there and settle once they have.
  const far = Math.abs(row.getBoundingClientRect().top) > innerHeight * 1.5;
  row.scrollIntoView({ behavior: far || reduceMotion.matches ? "auto" : "smooth", block: "center" });
  if (far) requestAnimationFrame(() => requestAnimationFrame(() => row.scrollIntoView({ block: "center" })));
  row.classList.remove("flash");
  void row.offsetWidth;
  row.classList.add("flash");
}

// Touch gliding works like a joystick. The middle of the shelf is the resting point:
// drag right of it and the shelf glides right, drag left and it glides left. The further
// out your finger goes, the faster it glides, and holding out at the edge (or past it)
// keeps picking up speed. Bring your finger back toward the middle to slow down.
const GLIDE_DEAD = 0.18;      // middle 18% (each side) of the shelf: no gliding
const GLIDE_MIN = 25;         // px/s just outside the middle (about 1 spine a second)
const GLIDE_MAX = 650;        // px/s at the edge of the shelf
const GLIDE_BOOST = 2.4;      // holding at the edge ramps up to this many times faster...
const GLIDE_BOOST_MS = 2500;  // ...over this long
const GLIDE_DELAY = 180;      // ms after touching down before gliding starts (so taps don't glide)
const GLIDE_SMOOTH = 220;     // ms: how quickly speed follows your finger (higher = gentler)
const GLIDE_BRAKE = 90;       // ms: how quickly it slows down or turns around
let edge = null;              // { last, down, pos, v, edgeSince } while a finger is on the shelf

function startEdgeScroll() {
  if (edge || !scrollMode || shelfPrefs.mode !== "glide") return;
  const now = performance.now();
  edge = { last: now, down: now, pos: scrollerEl().scrollLeft, v: 0, edgeSince: null };
  requestAnimationFrame(edgeStep);
}
function stopEdgeScroll() { edge = null; }

// Target speed (px/s, negative = left) for a finger at x.
function glideTarget(x, r, now) {
  const half = r.width / 2;
  const off = (x - (r.left + half)) / half;            // -1 at the left edge, +1 at the right edge
  const n = Math.max(0, (Math.abs(off) - GLIDE_DEAD) / (1 - GLIDE_DEAD));
  if (!n) { edge.edgeSince = null; return 0; }
  let speed = (GLIDE_MIN + (GLIDE_MAX - GLIDE_MIN) * Math.min(1, n) ** 2.2) * GLIDE_SPEEDS[shelfPrefs.speed].x;
  if (n >= 0.9) {
    // At (or past) the edge: keep speeding up the longer you hold there.
    edge.edgeSince ??= now;
    const t = Math.min(1, (now - edge.edgeSince) / GLIDE_BOOST_MS);
    speed *= 1 + (GLIDE_BOOST - 1) * t * t;
  } else {
    edge.edgeSince = null;
  }
  return Math.sign(off) * speed;
}

function edgeStep(now) {
  if (!edge) return;
  if (lastPointer == null || !scrollMode) { edge = null; return; }
  const s = scrollerEl();
  const dt = Math.min(50, now - edge.last);
  edge.last = now;
  const target = now - edge.down < GLIDE_DELAY ? 0 : glideTarget(lastPointer, s.getBoundingClientRect(), now);
  // Ease toward the target speed: gently when speeding up, quicker when slowing or turning back.
  const slowing = Math.abs(target) < Math.abs(edge.v) || Math.sign(target) !== Math.sign(edge.v);
  edge.v += (target - edge.v) * Math.min(1, dt / (slowing ? GLIDE_BRAKE : GLIDE_SMOOTH));
  if (Math.abs(edge.v) < 1 && !target) edge.v = 0;
  if (edge.v) {
    if (Math.abs(edge.pos - shelfX) > 2) edge.pos = shelfX;
    const max = s.scrollWidth - s.clientWidth;
    edge.pos = Math.max(0, Math.min(max, edge.pos + edge.v * dt / 1000));
    if (edge.pos === 0 || edge.pos === max) edge.v = 0;
    setShelfX(edge.pos);   // the scroll listener keeps the wave and the name under the finger
  }
  requestAnimationFrame(edgeStep);
}

// Touch taps and lifts on the shelf: lifting your finger over a spine picks it (it stays
// raised with its name showing). Tapping the picked spine again opens it in the list.
let touch = null;            // { x0, moved } while a finger is down
let touchClickGuard = 0;     // ignore the browser's click that follows a handled touch

// ---------- SHELF CONTROLS: how the shelf moves (the sliders button under the shelf) ----------
// Remembered in this browser. Glide = drag like a joystick; Swipe = scroll it like any list;
// Follow list = the shelf moves by itself to match where you are in the list below.
const SHELF_MODES = {
  glide:  { name: "Glide",  note: "Drag from the middle of the shelf. The further you drag, the faster it glides; hold at the edge to speed up." },
  swipe:  { name: "Swipe",  note: "Swipe the shelf like any list, and flick it to move quickly." },
  follow: { name: "Follow", note: "The shelf moves on its own to match where you are in the list. Games on screen lift up on the shelf." },
};
const GLIDE_SPEEDS = { gentle: { name: "Gentle", x: 0.55 }, normal: { name: "Normal", x: 1 }, fast: { name: "Fast", x: 1.7 } };
const shelfPrefs = Object.assign({ mode: "follow", speed: "normal", font: 15 }, loadLocal("backlog-shelf-v2", {}));
if (!(shelfPrefs.font >= 12 && shelfPrefs.font <= 24)) shelfPrefs.font = 15;
if (!SHELF_MODES[shelfPrefs.mode]) shelfPrefs.mode = "glide";
if (!GLIDE_SPEEDS[shelfPrefs.speed]) shelfPrefs.speed = "normal";
let shelfOptsOpen = false;

const ICON_SLIDERS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>`;

function shelfHint() {
  const touchy = matchMedia("(pointer: coarse)").matches;
  const open = touchy ? "tap twice to open" : "click a spine to jump to it";
  if (shelfPrefs.mode === "follow") return `follows the list · ${open}`;
  if (!touchy) return `scroll sideways · ${open}`;
  return `${shelfPrefs.mode === "swipe" ? "swipe" : "drag"} to ${shelfPrefs.mode === "swipe" ? "scroll" : "glide"} · ${open}`;
}

function applyShelfFont() {
  document.querySelector(".shelf-wrap").style.setProperty("--shelf-font", shelfPrefs.font + "px");
  labelW = 0; labelKey = "";
  showLabel(labelTarget());
}

function applyShelfMode() {
  shelfEl().dataset.mode = shelfPrefs.mode;
  scrollerEl().dataset.mode = shelfPrefs.mode;
  stopEdgeScroll();
  inView.forEach((i) => shelfEl().children[i]?.classList.remove("in-view"));
  inView = new Set();
  followCurrent = null;
  placeFollowMark();
  followList();
  showLabel(labelTarget());
}

function renderShelfOpts() {
  const m = shelfPrefs.mode;
  const seg = (attr, options, current) => `<div class="seg" role="radiogroup">${Object.entries(options).map(([k, o]) =>
    `<button type="button" role="radio" ${attr}="${k}" aria-checked="${k === current}">${o.name}</button>`).join("")}</div>`;
  document.getElementById("shelf-opts").innerHTML = `
    <button type="button" class="sopts-btn" data-sopts-toggle aria-haspopup="true" aria-expanded="${shelfOptsOpen}" aria-label="Shelf controls" title="Shelf controls">${ICON_SLIDERS}</button>
    ${shelfOptsOpen ? `
    <div class="sopts-panel" role="dialog" aria-label="Shelf controls">
      <p class="panel-label">How the shelf moves</p>
      ${seg("data-shelf-mode", SHELF_MODES, m)}
      <p class="sopts-note">${SHELF_MODES[m].note}</p>
      ${m === "glide" ? `<p class="panel-label">Glide speed</p>${seg("data-shelf-speed", GLIDE_SPEEDS, shelfPrefs.speed)}` : ""}
      ${m !== "follow" && !matchMedia("(pointer: coarse)").matches ? `<p class="sopts-note">With a mouse or trackpad, scroll the shelf sideways with the wheel.</p>` : ""}
      <p class="panel-label">Title size</p>
      <div class="fsize">
        <span class="a-sm" aria-hidden="true">A</span>
        <label class="sr" for="shelf-font">Title size on the shelf</label>
        <input type="range" id="shelf-font" min="12" max="24" step="1" value="${shelfPrefs.font}">
        <span class="a-lg" aria-hidden="true">A</span>
      </div>
    </div>` : ""}`;
}

function wireShelfOpts() {
  const box = document.getElementById("shelf-opts");
  renderShelfOpts();
  applyShelfFont();
  applyShelfMode();
  box.addEventListener("click", (event) => {
    event.stopPropagation();
    const b = event.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    let focus = null;
    if (d.soptsToggle !== undefined) { shelfOptsOpen = !shelfOptsOpen; focus = "[data-sopts-toggle]"; }
    else if (d.shelfMode) { shelfPrefs.mode = d.shelfMode; focus = `[data-shelf-mode="${d.shelfMode}"]`; }
    else if (d.shelfSpeed) { shelfPrefs.speed = d.shelfSpeed; focus = `[data-shelf-speed="${d.shelfSpeed}"]`; }
    else return;
    saveLocal("backlog-shelf-v2", shelfPrefs);
    renderShelfOpts();
    if (d.shelfMode) applyShelfMode();
    box.querySelector(focus)?.focus({ preventScroll: true });
  });
  box.addEventListener("input", (event) => {
    event.stopPropagation();
    if (event.target.id !== "shelf-font") return;
    shelfPrefs.font = Number(event.target.value);
    applyShelfFont();
    saveLocal("backlog-shelf-v2", shelfPrefs);
  });
  box.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && shelfOptsOpen) {
      event.stopPropagation();
      shelfOptsOpen = false; renderShelfOpts();
      box.querySelector("[data-sopts-toggle]")?.focus();
    }
  });
  // Touching or clicking anywhere else closes it (capture, so nothing on the page can swallow it).
  document.addEventListener("pointerdown", (event) => {
    if (shelfOptsOpen && !box.contains(event.target)) { shelfOptsOpen = false; renderShelfOpts(); }
  }, true);
}

// Follow list: glide the shelf to the games you're looking at in the list.
let inView = new Set();          // spines lifted because their games are on screen
let followQueued = false;
let followAnim = null;           // { target, pos, last } while the shelf is gliding to a spot

function followList() {
  if (shelfPrefs.mode !== "follow" || followQueued) return;
  followQueued = true;
  requestAnimationFrame(() => { followQueued = false; syncFollow(); });
}

function syncFollow() {
  if (shelfPrefs.mode !== "follow") return;
  // 1. Read: which list rows are on screen, below the shelf bar. Rows are in order, so a
  //    binary search finds the first one; nothing on the page has changed yet, so these
  //    measurements are cheap.
  const seen = new Set();
  let first = null;
  if (page === "backlog") {
    const rows = document.getElementById("list").children;
    const topLine = document.querySelector(".shelf-wrap").getBoundingClientRect().bottom + 6;
    let lo = 0, hi = rows.length - 1, start = rows.length;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (rows[mid].getBoundingClientRect().bottom > topLine) { start = mid; hi = mid - 1; } else lo = mid + 1;
    }
    for (let k = start; k < rows.length; k++) {
      const el = rows[k];
      if (el.getBoundingClientRect().top >= innerHeight) break;
      if (el.dataset.index === undefined) continue;
      const i = Number(el.dataset.index);
      if (first == null) first = i;
      seen.add(i);
    }
  }
  // 2. Write: lift the spines on screen, move the arrow and the name.
  const spines = shelfEl().children;
  inView.forEach((i) => { if (!seen.has(i)) spines[i]?.classList.remove("in-view"); });
  seen.forEach((i) => { if (!inView.has(i)) spines[i]?.classList.add("in-view"); });
  inView = seen;
  followCurrent = first;
  placeFollowMark();
  if (hovered == null) showLabel(labelTarget());
  if (first == null || !scrollMode) return;
  if (shelfEl().contains(document.activeElement) && document.activeElement.matches(":focus-visible")) return;   // browsing the shelf by keyboard
  // In shelf order the games on screen sit side by side, so centre the whole group;
  // in any other order, centre the top one.
  const idx = [...seen];
  const center = view.sort === "shelf" ? (Math.min(...idx) + Math.max(...idx)) / 2 : first;
  const pitch = SPINE_W + SCROLL_GAP;
  const maxX = Math.max(0, state.games.length * pitch - SCROLL_GAP - shelfViewW);
  const target = Math.max(0, Math.min(maxX, center * pitch + SPINE_W / 2 - shelfViewW / 2));
  if (followAnim) { followAnim.target = target; return; }
  followAnim = { target, pos: shelfX, last: performance.now() };
  requestAnimationFrame(followStep);
}

// Put the arrow under the shelf beneath the game at the top of the list.
function placeFollowMark() {
  const mark = document.getElementById("follow-mark");
  const on = shelfPrefs.mode === "follow" && page === "backlog" && followCurrent != null && !!state.games[followCurrent];
  if (mark.classList.contains("on") !== on) mark.classList.toggle("on", on);
  if (!on) return;
  const x = spineCenterX(followCurrent);
  const arrow = mark.firstElementChild;
  arrow.style.left = Math.max(0, Math.min(shelfViewW, x)) + "px";
  arrow.style.visibility = x < 0 || x > shelfViewW ? "hidden" : "";
}

function followStep(now) {
  if (!followAnim || shelfPrefs.mode !== "follow") { followAnim = null; return; }
  const a = followAnim;
  const dt = Math.min(50, now - a.last);
  a.last = now;
  const k = reduceMotion.matches ? 1 : 1 - Math.exp(-dt / 160);   // smooth, unhurried catch-up
  a.pos += (a.target - a.pos) * k;
  if (Math.abs(a.target - a.pos) < 0.5) a.pos = a.target;
  setShelfX(a.pos);
  updateEdges();
  placeFollowMark();
  if (hovered == null) showLabel(labelTarget());
  if (a.pos === a.target) { followAnim = null; return; }
  requestAnimationFrame(followStep);
}

// Pointer (mouse, pen, or a finger dragged across the shelf).
let lastPointer = null;
function onShelfPointer(event) {
  lastPointer = event.clientX;
  hovered = spineAt(event.clientX);
  wave(event.clientX);
  showLabel(hovered);
}
function onShelfLeave() {
  lastPointer = null;
  wave(null);
  hovered = null;
  showLabel(labelTarget());
}

function wireShelf() {
  const shelf = shelfEl();
  const scroller = scrollerEl();
  shelf.addEventListener("pointermove", onShelfPointer);
  shelf.addEventListener("pointerdown", (event) => {
    onShelfPointer(event);
    if (event.pointerType === "mouse") return;
    touch = { x0: event.clientX, moved: false };
    startEdgeScroll();
  });
  shelf.addEventListener("pointermove", (event) => {
    if (touch && Math.abs(event.clientX - touch.x0) > 8) touch.moved = true;
  });
  shelf.addEventListener("pointerup", (event) => {
    if (event.pointerType === "mouse" || !touch) return;
    stopEdgeScroll();
    const i = spineAt(event.clientX);
    const tappedPicked = !touch.moved && i === selected;
    touch = null;
    touchClickGuard = Date.now() + 700;
    if (tappedPicked) jumpTo(i);                       // second tap: open it in the list
    else select(i, { force: true, reveal: false });    // lift: pick it, stay on the shelf
  });
  shelf.addEventListener("pointerleave", () => { stopEdgeScroll(); onShelfLeave(); });
  shelf.addEventListener("pointercancel", () => { touch = null; stopEdgeScroll(); onShelfLeave(); });
  // No long-press menu (copy, share, open link...) on the shelf.
  shelf.closest(".shelf-wrap").addEventListener("contextmenu", (event) => event.preventDefault());

  // Scrolling shelf: the mouse wheel scrolls it sideways while the pointer is over it.
  // At either end the wheel scrolls the page as usual.
  scroller.addEventListener("wheel", (event) => {
    if (!scrollMode || shelfPrefs.mode === "follow" || event.ctrlKey || Math.abs(event.deltaX) >= Math.abs(event.deltaY)) return;
    const max = scroller.scrollWidth - scroller.clientWidth;
    const d = event.deltaMode === 1 ? event.deltaY * 16 : event.deltaY;
    if ((d > 0 && scroller.scrollLeft >= max - 1) || (d < 0 && scroller.scrollLeft <= 0)) return;
    event.preventDefault();
    scroller.scrollLeft += d;
  }, { passive: false });
  // While it scrolls, keep the wave and the name under the pointer.
  let scrollQueued = false;
  scroller.addEventListener("scroll", () => {
    if (scrollQueued) return;
    scrollQueued = true;
    requestAnimationFrame(() => {
      scrollQueued = false;
      if (!followAnim && !edge) shelfX = scroller.scrollLeft;   // our own glides already know where they are
      updateEdges();
      if (lastPointer != null) { hovered = spineAt(lastPointer); wave(lastPointer); }
      showLabel(labelTarget());
    });
  }, { passive: true });

  // Keyboard: focus a spine to see its name; arrows move along the shelf.
  shelf.addEventListener("focusin", (event) => {
    const el = event.target.closest(".spine");
    if (!el) return;
    hovered = Number(el.dataset.spine);
    revealSpine(hovered, false);
    const { rect, slot } = shelfGeometry();
    wave(rect.left + (hovered + 0.5) * slot);
    showLabel(hovered);
  });
  shelf.addEventListener("focusout", (event) => {
    if (!shelf.contains(event.relatedTarget)) onShelfLeave();
  });
  shelf.addEventListener("keydown", (event) => {
    const el = event.target.closest(".spine");
    if (!el) return;
    const n = state.games.length;
    const i = Number(el.dataset.spine);
    const next = { ArrowLeft: i - 1, ArrowRight: i + 1, Home: 0, End: n - 1, PageUp: i - 20, PageDown: i + 20 }[event.key];
    if (next === undefined) return;
    event.preventDefault();
    const j = Math.max(0, Math.min(n - 1, next));
    const target = shelf.children[j];
    el.tabIndex = -1;
    target.tabIndex = 0;
    if (spineDrawn[i]) spineDrawn[i].ti = -1;
    if (spineDrawn[j]) spineDrawn[j].ti = 0;
    target.focus({ preventScroll: true });
  });

  // Selecting a game in the list (clicking anywhere in its row, or tabbing into it
  // with the keyboard) raises its spine and highlights the row. Hovering does nothing.
  const list = document.getElementById("list");
  list.addEventListener("click", (event) => {
    const row = event.target.closest("li[data-index]");
    if (row) pick(Number(row.dataset.index));
  });
  list.addEventListener("focusin", (event) => {
    const row = event.target.closest("li[data-index]");
    if (row && event.target.matches(":focus-visible") && Date.now() > quietUntil) pick(Number(row.dataset.index));
  });

  addEventListener("resize", () => { setShelfMode(); shelfX = scrollerEl().scrollLeft; labelW = 0; labelKey = ""; updateEdges(); showLabel(labelTarget()); placeFollowMark(); });

  // Add a divider under the shelf once it's stuck to the top.
  const wrap = shelf.closest(".shelf-wrap");
  // Page scrolling: at most one update per frame, measuring first and changing things after.
  let pageQueued = false;
  let settleTimer = null;
  const onScroll = () => {
    lastListScrollAt = performance.now();
    clearTimeout(settleTimer);
    settleTimer = setTimeout(syncFollow, 160);   // once more after scrolling stops
    if (pageQueued) return;
    pageQueued = true;
    requestAnimationFrame(() => {
      pageQueued = false;
      const stuck = scrollY > 0 && wrap.getBoundingClientRect().top <= 1;
      syncFollow();
      if (wrap.classList.contains("stuck") !== stuck) wrap.classList.toggle("stuck", stuck);
      toTopVisible(scrollY > 700);
    });
  };
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();
}

// Remove a game (and its journal) from the backlog.
function removeGame(i) {
  const game = state.games[i];
  pendingRemove = null;
  if (!game) return;
  state.games.splice(i, 1);
  state.ranking = state.ranking.filter((t) => t !== game.title);
  // Keep its journal entries on the Journal page.
  const removedAt = new Date().toISOString();
  state.archive.push(...game.sessions.map((s) => ({ ...s, game: game.title, removedAt })));
  // Clean up anything that pointed at it.
  expanded.delete(game.title); saveOpen();
  delete drafts[game.title]; saveDrafts();
  game.sessions.forEach((s) => openEntries.delete(s.id)); saveOpenEntries();
  // Positions after `i` moved by one; reset position-based selections.
  selected = null; highlighted = null; hovered = null; editing = null; pendingDelete = null; resetWave();
  save();
  update();
  setNote(`Removed "${game.title}". Saving…`);
}

// ============================================================
// 3c. ADD A GAME: the "+ Add a game" button between the shelf and the list.
//     It opens a small form; nothing is saved until you press "Add to backlog".
// ============================================================
let addOpen = false;
const blankAdd = () => ({ title: "", genre: "", status: "backlog", platforms: [], rating: 0, hours: "", next: false });
let addDraft = blankAdd();
let addError = "";

function renderAddGame() {
  const d = addDraft;
  const box = document.getElementById("add-game");
  if (steam.open) { box.innerHTML = steamPanelHtml(); return; }
  if (!addOpen) {
    box.innerHTML = `<div class="add-buttons">
      <button class="add-toggle" data-add-toggle aria-expanded="false"><span class="plus" aria-hidden="true">+</span>Add a game</button>
      <button class="add-toggle steam-toggle" data-steam-toggle aria-expanded="false">${ICON_STEAM}Import from Steam</button>
    </div>${steam.done ? `<p class="hint steam-done" role="status">${escapeHtml(steam.done)}</p>` : ""}`;
    return;
  }
  let stars = "";
  for (let n = 1; n <= 5; n++) {
    const fill = d.rating >= n ? "full" : d.rating >= n - 0.5 ? "half" : "";
    stars += `<span class="rs ${fill}">
      <button type="button" data-add-rate="${n - 0.5}" aria-label="${n - 0.5} stars" title="${n - 0.5}"></button>
      <button type="button" data-add-rate="${n}" aria-label="${n} star${n > 1 ? "s" : ""}" title="${n}"></button>
    </span>`;
  }
  box.innerHTML = `
    <form class="add-panel" id="add-form" novalidate>
      <div class="add-head">
        <h2>Add a game</h2>
        <button type="button" class="del" data-add-toggle aria-expanded="true">Close</button>
      </div>

      <div>
        <label class="panel-label" for="add-title">Title</label>
        <input class="field f-title" id="add-title" name="title" maxlength="120" autocomplete="off"
          placeholder="Game title" value="${escapeHtml(d.title)}">
      </div>

      <div>
        <p class="panel-label">Status</p>
        <div class="status" role="group" aria-label="Status">
          ${STATUSES.map((s) => `<button type="button" data-add-status="${s}" data-status="${s}" aria-pressed="${d.status === s}">${LABELS[s]}</button>`).join("")}
        </div>
      </div>

      <div>
        <label class="panel-label" for="add-genre">Genre</label>
        <select class="field" id="add-genre" name="genre">${genreOptions(d.genre)}</select>
      </div>

      <div>
        <p class="panel-label">Platforms</p>
        <div class="plats" role="group" aria-label="Platforms">
          ${PLATFORMS.map((p) => `<button type="button" class="plat" data-add-plat="${p}" aria-pressed="${d.platforms.includes(p)}">${p}</button>`).join("")}
        </div>
      </div>

      <div class="add-row">
        <div>
          <p class="panel-label">Rating</p>
          <span class="rating" role="group" aria-label="Rating">${stars}</span>
          <span class="rating-num">${d.rating ? d.rating.toFixed(1) + " / 5" : "Not rated"}</span>
        </div>
        <div>
          <label class="panel-label" for="add-hours">Hours played</label>
          <input class="field f-hours" id="add-hours" name="hours" type="number" min="0" step="0.5"
            inputmode="decimal" placeholder="0" value="${escapeHtml(d.hours)}">
        </div>
        <label class="check-row" for="add-next">
          <input type="checkbox" id="add-next" name="next" ${d.next ? "checked" : ""}> ★ Up next
        </label>
      </div>

      <div class="log-actions">
        <span class="hint ${addError ? "error" : ""}" id="add-hint">${addError || "Only the title is required."}</span>
        <span class="edit-buttons">
          <button type="button" class="cancel" data-add-cancel>Cancel</button>
          <button class="add" type="submit">Add to backlog</button>
        </span>
      </div>
    </form>`;
}

// Shelf order ignores a leading "The", like the rest of the list ("The Blood of Dawnwalker" sits under B).
const shelfKey = (t) => t.replace(/^the\s+/i, "").toLowerCase();

function addGame() {
  const title = addDraft.title.trim().replace(/\s+/g, " ");
  if (!title) { addError = "Give the game a title first."; return false; }
  if (state.games.some((g) => g.title.toLowerCase() === title.toLowerCase())) {
    addError = `"${title}" is already in your backlog.`;
    return false;
  }
  let hours = parseFloat(addDraft.hours);
  if (!isFinite(hours) || hours < 0) hours = 0;
  const game = {
    title, status: addDraft.status, next: addDraft.next,
    hours: Math.round(hours * 10) / 10, rating: addDraft.rating,
    platforms: PLATFORMS.filter((p) => addDraft.platforms.includes(p)), sessions: [], genre: addDraft.genre || "",
  };
  if (game.status === "finished") { game.status = "backlog"; setStatus(game, "finished"); }
  // Slot it into shelf order alphabetically.
  let at = state.games.findIndex((g) => shelfKey(g.title).localeCompare(shelfKey(title)) > 0);
  if (at === -1) at = state.games.length;
  state.games.splice(at, 0, game);
  // Positions after `at` moved by one; reset position-based selections.
  selected = null; highlighted = null; editing = null; pendingDelete = null; resetWave();
  return at;
}

function wireAddGame() {
  const box = document.getElementById("add-game");
  renderAddGame();

  box.addEventListener("click", (event) => {
    const b = event.target.closest("button");
    if (!b) return;
    event.stopPropagation();   // keep these clicks away from the list's handlers
    if (steamClick(b)) return;
    const d = b.dataset;
    let focusKey = null;
    if (d.addToggle !== undefined) {
      addOpen = !addOpen; addError = ""; steam.done = "";
      renderAddGame();
      (addOpen ? document.getElementById("add-title") : box.querySelector(".add-toggle"))?.focus();
      return;
    } else if (d.addCancel !== undefined) {
      addOpen = false; addDraft = blankAdd(); addError = "";
      renderAddGame();
      box.querySelector(".add-toggle")?.focus();
      return;
    } else if (d.addStatus) { addDraft.status = d.addStatus; focusKey = `[data-add-status="${d.addStatus}"]`; }
    else if (d.addPlat) {
      const on = !addDraft.platforms.includes(d.addPlat);
      addDraft.platforms = PLATFORMS.filter((p) => (p === d.addPlat ? on : addDraft.platforms.includes(p)));
      focusKey = `[data-add-plat="${d.addPlat}"]`;
    } else if (d.addRate) {
      const v = Number(d.addRate);
      addDraft.rating = addDraft.rating === v ? 0 : v;
      focusKey = `[data-add-rate="${d.addRate}"]`;
    } else return;
    renderAddGame();
    if (focusKey) box.querySelector("button" + focusKey)?.focus({ preventScroll: true });
  });

  box.addEventListener("input", (event) => {
    event.stopPropagation();
    if (steam.open) { steamInput(event.target); return; }
    const f = document.getElementById("add-form")?.elements;
    if (!f) return;
    addDraft.title = f.title.value;
    addDraft.hours = f.hours.value;
    addDraft.next = f.next.checked;
    addDraft.genre = f.genre.value;
    if (addError && event.target.name === "title") {
      addError = "";
      const hint = document.getElementById("add-hint");
      hint.textContent = "Only the title is required.";
      hint.classList.remove("error");
    }
  });

  box.addEventListener("keydown", (event) => {
    if (event.key === "Escape") { event.stopPropagation(); box.querySelector("[data-add-cancel], [data-steam-close]")?.click(); }
  });

  box.addEventListener("submit", (event) => {
    event.preventDefault();
    event.stopPropagation();
    if (steam.open) { steamSubmit(); return; }
    const at = addGame();
    if (at === false) {
      renderAddGame();
      document.getElementById("add-title")?.focus();
      return;
    }
    addOpen = false; addDraft = blankAdd(); addError = "";
    renderAddGame();
    save();
    update();
    jumpTo(at);   // show it: bounce its spine, scroll to it, highlight it
  });
}

// ============================================================
// 3c-2. IMPORT FROM STEAM: paste your Steam library, check what to bring in.
//     This page can't reach Steam by itself, so you copy the data from Steam
//     and paste it here. Three kinds of paste work:
//       1. Steam's own library data (the JSON from the Steam Web API link below),
//       2. text copied from your Steam profile's Games page,
//       3. a plain list, one game per line ("Valheim, 40" or "Valheim - 40 h").
//     Your API key is only used to build the link; it's never saved.
// ============================================================
const steam = { done: "", open: false, text: "", items: null, source: "", picks: new Set(), error: "", q: "", key: "", id: "" };
const ICON_STEAM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>`;
const STEAM_ROWS = 200;   // the review list shows this many new games at once
const STEAM_GAMES_PAGE = "https://steamcommunity.com/my/games/?tab=all";

// Names compare loosely: case, ™/®, punctuation and a leading "The" don't matter.
function matchKey(name) {
  return name.replace(/[\u2122\u00ae\u00a9]/g, "").normalize("NFKD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().replace(/^the\s+/, "")
    .replace(/&/g, " and ").replace(/[^a-z0-9]+/g, " ").trim();
}

// Lines on Steam's pages that aren't game names: whole-line buttons and menu words,
// and labelled lines like "Last played Sep 20" or "Achievements 12/40".
const STEAM_WORDS = new Set(("install|play|manage|store page|community hub|links|view stats|view details|screenshots|videos|" +
  "workshop|news|guides|reviews|discussions|games|all games|perfect games|recently played|followed|wishlist|sort by|" +
  "search|filter|store|community|about|support|library|profile|friends|groups|badges|inventory|wallet|activity|home|" +
  "discovery queue|points shop|charts|install steam|login|sign in|language|view desktop website|privacy policy|legal|" +
  "steam subscriber agreement|refunds|cookies|you|chat|menu|more|less|show more|show less|pc|steam deck|hide|stats|" +
  "achievements|last played|total played|playtime|hours|online|offline|in-game|downloads|game details").split("|"));
const STEAM_LABEL = /^(last played|total played|achievements?|last two weeks|playtime|played on)\b/i;
const HOURS_RE = /([\d][\d,]*(?:\.\d+)?)\s*(?:hrs?|hours?)\b/i;

function parseSteam(text) {
  const raw = text.trim();
  if (!raw) return { items: [], source: "", error: "Paste something first." };

  // 1. JSON from the Steam Web API (or any list of { name, playtime_forever }).
  if (/^[\[{]/.test(raw)) {
    let data;
    try { data = JSON.parse(raw); } catch (e) { return { items: [], source: "", error: "That looks like Steam data, but it's cut off. Copy the whole page and try again." }; }
    const games = Array.isArray(data) ? data : data?.response?.games ?? data?.games;
    if (!Array.isArray(games)) {
      if (data?.response && !data.response.games) {
        return { items: [], source: "", error: "Steam sent back no games. Make sure “Game details” is set to Public in your Steam privacy settings, then open the link again." };
      }
      return { items: [], source: "", error: "Couldn't find a list of games in that data." };
    }
    if (games.length && !games.some((g) => g.name)) {
      return { items: [], source: "", error: "That data has no game names. Use Steam\u2019s data link above; it asks Steam to include them." };
    }
    const items = games.filter((g) => g && typeof g.name === "string" && g.name.trim()).map((g) => ({
      name: g.name.trim(),
      hours: typeof g.playtime_forever === "number" ? g.playtime_forever / 60 : null,
      appid: Number.isInteger(g.appid) ? g.appid : null,
    }));
    return { items, source: "steam-data" };
  }

  // 2 & 3. Text: a Steam Games page, or a plain list.
  const lines = raw.split(/\r?\n/).map((l) => l.replace(/\s+/g, " ").trim()).filter(Boolean);
  const looksLikeSteamPage = lines.some((l) => /^(total played|last played|achievements)\b|hrs on record/i.test(l));
  const items = [];
  for (const line of lines) {
    const hrs = line.match(HOURS_RE);
    const labelled = /^(total played|played|hrs on record)|on record/i.test(line) || (hrs && hrs.index === 0);
    if (hrs && labelled) {
      // "TOTAL PLAYED 40.2 hours" / "40.2 hrs on record": belongs to the game above it.
      const last = items[items.length - 1];
      if (last && last.hours == null) last.hours = parseFloat(hrs[1].replace(/,/g, ""));
      continue;
    }
    if (STEAM_WORDS.has(line.toLowerCase()) || STEAM_LABEL.test(line) || /valve corporation|©/i.test(line) ||
        /^[\d\s.,:/%-]+$/.test(line) || line.length > 120) continue;
    // Plain list: "Valheim, 40" / "Valheim - 40 h" / "Valheim\t40.5"
    const m = line.match(/^(.*?)\s*(?:[,\t|;]|\s[-–—]\s|:\s)\s*([\d][\d,]*(?:\.\d+)?)\s*(?:h|hrs?|hours?)?$/i) ||
              line.match(/^(.*\S)\s+([\d][\d,]*(?:\.\d+)?)\s*(?:h|hrs?|hours?)$/i);   // "Valheim 40 h"
    if (m && m[1]) items.push({ name: m[1].trim(), hours: parseFloat(m[2].replace(/,/g, "")), appid: null });
    else items.push({ name: line.replace(/^[-*•]\s*/, ""), hours: null, appid: null });
  }
  return { items, source: looksLikeSteamPage ? "steam-page" : "list" };
}

// Turn parsed lines into a review list: matched to your backlog, or new.
function reviewSteam(parsed) {
  const byKey = new Map();
  for (const it of parsed) {
    const key = matchKey(it.name);
    if (!key) continue;
    const had = byKey.get(key);
    if (!had) byKey.set(key, { ...it, key });
    else if ((it.hours ?? -1) > (had.hours ?? -1)) Object.assign(had, { hours: it.hours, appid: it.appid ?? had.appid });
  }
  const where = new Map(state.games.map((g, i) => [matchKey(g.title), i]));
  return [...byKey.values()].map((it) => {
    const index = where.has(it.key) ? where.get(it.key) : null;
    if (it.hours != null) it.hours = Math.round(it.hours * 10) / 10;
    const current = index != null ? state.games[index].hours : 0;
    return { ...it, index, raises: index != null && it.hours != null && it.hours > current };
  });
}

function steamRunParse() {
  const r = parseSteam(steam.text);
  steam.error = r.error || "";
  steam.source = r.source;
  steam.items = r.error ? null : reviewSteam(r.items);
  steam.q = "";
  if (steam.items && !steam.items.length) { steam.error = "Couldn't find any games in that."; steam.items = null; }
  steam.picks = new Set();
  if (steam.items) {
    // Hours updates are pre-checked. New games are pre-checked only for a short
    // hand-made list; for a whole Steam library you pick the ones you want.
    for (const it of steam.items) {
      if (it.raises) steam.picks.add(it.key);
      if (it.index == null && steam.source === "list" && steam.items.length <= 50) steam.picks.add(it.key);
    }
  }
}

function steamApiUrl() {
  const key = steam.key.trim(), id = steam.id.trim();
  if (!/^[A-Za-z0-9]{20,40}$/.test(key) || !/^\d{17}$/.test(id)) return "";
  return `https://api.steampowered.com/IPlayerService/GetOwnedGames/v1/?key=${key}&steamid=${id}&include_appinfo=1&include_played_free_games=1&format=json`;
}

function steamPanelHtml() {
  const s = steam;
  const head = `
    <div class="add-head">
      <h2>Import from Steam</h2>
      <button type="button" class="del" data-steam-close aria-expanded="true">Close</button>
    </div>`;

  if (!s.items) {
    const url = steamApiUrl();
    return `
      <form class="add-panel steam-panel" id="steam-form" novalidate>
        ${head}
        <ol class="steam-steps">
          <li>Open your <a href="${STEAM_GAMES_PAGE}" target="_blank" rel="noopener">Steam Games page</a> (sign in if asked), select everything on it, and copy.</li>
          <li>Paste it below. A plain list works too: one game per line, with hours if you like (<code>Valheim, 40</code>).</li>
        </ol>
        <details class="steam-api">
          <summary>Want exact hours for your whole library? Use Steam's data link</summary>
          <div class="steam-api-body">
            <p>Get a free key at <a href="https://steamcommunity.com/dev/apikey" target="_blank" rel="noopener">steamcommunity.com/dev/apikey</a>.
              Your SteamID is the 17-digit number in your profile's address (steamcommunity.com/profiles/<b>7656…</b>).
              The key is only used to build the link below and is never saved.</p>
            <div class="log-fields">
              <label class="sr" for="steam-key">Steam Web API key</label>
              <input class="field" id="steam-key" type="password" autocomplete="off" spellcheck="false" placeholder="API key" value="${escapeHtml(s.key)}">
              <label class="sr" for="steam-id">SteamID (17 digits)</label>
              <input class="field" id="steam-id" inputmode="numeric" autocomplete="off" placeholder="SteamID, 17 digits" value="${escapeHtml(s.id)}">
            </div>
            <p id="steam-link">${url
              ? `<a class="steam-open" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open my library data ↗</a> Then select all, copy, and paste it below.`
              : `<span class="hint">Fill in both to get your link.</span>`}</p>
          </div>
        </details>
        <label class="sr" for="steam-text">Paste your Steam library</label>
        <textarea class="field steam-text" id="steam-text" spellcheck="false"
          placeholder="Paste here">${escapeHtml(s.text)}</textarea>
        <div class="log-actions">
          <span class="hint ${s.error ? "error" : ""}" id="steam-hint">${escapeHtml(s.error) || "Nothing changes until you review and confirm."}</span>
          <span class="edit-buttons">
            <button type="button" class="cancel" data-steam-close>Cancel</button>
            <button class="add" type="submit">Review</button>
          </span>
        </div>
      </form>`;
  }

  // Review step.
  const matched = s.items.filter((it) => it.index != null);
  const fresh = s.items.filter((it) => it.index == null)
    .sort((a, b) => (b.hours ?? -1) - (a.hours ?? -1) || shelfKey(a.name).localeCompare(shelfKey(b.name)));
  const q = matchKey(s.q);
  const shownFresh = q ? fresh.filter((it) => it.key.includes(q)) : fresh;
  const nAdd = fresh.filter((it) => s.picks.has(it.key)).length;
  const nUpd = matched.filter((it) => s.picks.has(it.key)).length;
  const hrs = (h) => (h == null ? "" : `${fmtHours(h)} h`);
  const row = (it, body) => `
    <li class="srow">
      <label>
        <input type="checkbox" data-steam-pick="${escapeHtml(it.key)}" ${s.picks.has(it.key) ? "checked" : ""} ${body.disabled ? "disabled" : ""}>
        <span class="sname">${escapeHtml(body.title)}</span>
        <span class="shrs">${body.meta}</span>
      </label>
    </li>`;
  const from = { "steam-data": "Steam library data", "steam-page": "your Steam Games page", list: "your list" }[s.source];

  return `
    <form class="add-panel steam-panel" id="steam-form" novalidate>
      ${head}
      <p class="steam-found">Found ${plural(s.items.length, "game", "games")} in ${from}:
        ${matched.length} already in your backlog, ${fresh.length} not yet.</p>

      ${matched.length ? `
      <section>
        <p class="panel-label">Already in your backlog</p>
        <ul class="slist">${matched.map((it) => {
          const g = state.games[it.index];
          return row(it, it.raises
            ? { title: g.title, meta: `${fmtHours(g.hours)} h → <b>${fmtHours(it.hours)} h</b>` }
            : { title: g.title, meta: it.hours == null ? "no hours in paste" : "hours up to date", disabled: true });
        }).join("")}</ul>
        <p class="hint">Checked games take Steam's total hours. Hours only ever go up.</p>
      </section>` : ""}

      ${fresh.length ? `
      <section>
        <div class="shead">
          <p class="panel-label">Not in your backlog</p>
          <span class="sbulk">
            <button type="button" class="del" data-steam-all="1">Select all${q ? " shown" : ""}</button>
            <button type="button" class="del" data-steam-all="0">Clear</button>
          </span>
        </div>
        ${fresh.length > 12 ? `
          <label class="sr" for="steam-q">Find a game</label>
          <input class="field steam-q" id="steam-q" type="search" placeholder="Find a game" autocomplete="off" value="${escapeHtml(s.q)}">` : ""}
        <ul class="slist tall" id="steam-fresh">${shownFresh.slice(0, STEAM_ROWS).map((it) => row(it, { title: it.name, meta: hrs(it.hours) })).join("") ||
          `<li class="srow none">No matches.</li>`}${shownFresh.length > STEAM_ROWS
          ? `<li class="srow none">Showing ${STEAM_ROWS} of ${shownFresh.length.toLocaleString()}. Search to find the others; “Select all” includes them.</li>` : ""}</ul>
        <p class="hint">Checked games are added to your backlog with status Backlog.</p>
      </section>` : ""}

      <div class="log-actions">
        <button type="button" class="del" data-steam-back>← Paste something else</button>
        <span class="edit-buttons">
          <button type="button" class="cancel" data-steam-close>Cancel</button>
          <button class="add" type="submit" ${nAdd + nUpd ? "" : "disabled"} id="steam-go">${steamGoLabel(nAdd, nUpd)}</button>
        </span>
      </div>
    </form>`;
}

function steamGoLabel(nAdd, nUpd) {
  if (!nAdd && !nUpd) return "Nothing selected";
  return [nAdd ? `Add ${nAdd}` : "", nUpd ? `update ${nUpd}` : ""].filter(Boolean).join(", ").replace(/^./, (c) => c.toUpperCase());
}

// Bring the checked games in.
function applySteam() {
  let added = 0, updated = 0;
  const items = steam.items.filter((it) => steam.picks.has(it.key));
  for (const it of steam.items) {
    // Remember the Steam app id on games you already have (handy for cover art later).
    if (it.index != null && it.appid && !state.games[it.index].steam) state.games[it.index].steam = it.appid;
  }
  for (const it of items) {
    if (it.index != null) {
      const g = state.games[it.index];
      if (it.hours != null && it.hours > g.hours) { g.hours = it.hours; updated++; }
    }
  }
  for (const it of items) {
    if (it.index != null) continue;
    const title = it.name.replace(/\s+/g, " ").slice(0, 120);
    if (state.games.some((g) => matchKey(g.title) === it.key)) continue;
    const game = { title, status: "backlog", next: false, hours: it.hours ?? 0, rating: 0, platforms: [], sessions: [] };
    if (it.appid) game.steam = it.appid;
    let at = state.games.findIndex((g) => shelfKey(g.title).localeCompare(shelfKey(title)) > 0);
    if (at === -1) at = state.games.length;
    state.games.splice(at, 0, game);
    added++;
  }
  // Positions moved; reset position-based selections (same as adding one game).
  selected = null; highlighted = null; hovered = null; editing = null; pendingDelete = null; pendingRemove = null; resetWave();
  return { added, updated };
}

function steamRefreshCount() {
  const go = document.getElementById("steam-go");
  if (!go || !steam.items) return;
  const nAdd = steam.items.filter((it) => it.index == null && steam.picks.has(it.key)).length;
  const nUpd = steam.items.filter((it) => it.index != null && steam.picks.has(it.key)).length;
  go.textContent = steamGoLabel(nAdd, nUpd);
  go.disabled = !(nAdd + nUpd);
}

// Called from the add-game section's listeners. Each returns true when it handled the event.
function steamClick(b) {
  const d = b.dataset;
  const box = document.getElementById("add-game");
  if (d.steamToggle !== undefined) {
    steam.open = true; addOpen = false; steam.done = "";
    renderAddGame();
    document.getElementById("steam-text")?.focus();
    return true;
  }
  if (d.steamClose !== undefined) {
    Object.assign(steam, { open: false, text: "", items: null, error: "", q: "", key: "", id: "" });
    steam.picks = new Set();
    renderAddGame();
    box.querySelector("[data-steam-toggle]")?.focus();
    return true;
  }
  if (d.steamBack !== undefined) {
    steam.items = null; steam.error = "";
    renderAddGame();
    document.getElementById("steam-text")?.focus();
    return true;
  }
  if (d.steamAll !== undefined) {
    const q = matchKey(steam.q);
    steam.items.filter((it) => it.index == null && (!q || it.key.includes(q)))
      .forEach((it) => (d.steamAll === "1" ? steam.picks.add(it.key) : steam.picks.delete(it.key)));
    renderAddGame();
    box.querySelector(`[data-steam-all="${d.steamAll}"]`)?.focus({ preventScroll: true });
    return true;
  }
  return false;
}

let steamQTimer = null;
function steamInput(t) {
  if (t.id === "steam-text") { steam.text = t.value; return true; }
  if (t.id === "steam-key" || t.id === "steam-id") {
    steam[t.id === "steam-key" ? "key" : "id"] = t.value;
    const url = steamApiUrl();
    document.getElementById("steam-link").innerHTML = url
      ? `<a class="steam-open" href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">Open my library data ↗</a> Then select all, copy, and paste it below.`
      : `<span class="hint">Fill in both to get your link.</span>`;
    return true;
  }
  if (t.id === "steam-q") {
    steam.q = t.value;
    clearTimeout(steamQTimer);
    steamQTimer = setTimeout(() => {
      const box = document.getElementById("steam-q");
      const pos = box?.selectionStart ?? steam.q.length;
      renderAddGame();
      const again = document.getElementById("steam-q");
      again?.focus(); again?.setSelectionRange(pos, pos);
    }, 150);
    return true;
  }
  if (t.dataset?.steamPick !== undefined) {
    t.checked ? steam.picks.add(t.dataset.steamPick) : steam.picks.delete(t.dataset.steamPick);
    steamRefreshCount();
    return true;
  }
  return false;
}

function steamSubmit() {
  if (!steam.items) {
    steamRunParse();
    renderAddGame();
    if (steam.items) document.querySelector("#steam-form .panel-label, #steam-form .steam-found")?.scrollIntoView({ block: "nearest" });
    else document.getElementById("steam-text")?.focus();
    return;
  }
  const { added, updated } = applySteam();
  Object.assign(steam, { open: false, text: "", items: null, error: "", q: "", key: "", id: "" });
  steam.picks = new Set();
  renderAddGame();
  save();
  update();
  const msg = [added ? `added ${plural(added, "game", "games")}` : "", updated ? `updated hours on ${updated}` : ""].filter(Boolean).join(" and ");
  steam.done = msg ? `Steam import: ${msg}.` : "Steam import: nothing needed changing.";
  renderAddGame();
  setNote(msg ? `Steam import: ${msg}. Saving…` : "");
  document.getElementById("add-game")?.scrollIntoView({ block: "nearest" });
}

// ============================================================
// 3d. BACKLOG NAME: click the heading (or the pencil) to rename it.
//     Enter or clicking away saves; Escape cancels.
// ============================================================
let renaming = false;

function renderName() {
  const wrap = document.getElementById("name-wrap");
  document.title = state.name;
  if (renaming) {
    wrap.innerHTML = `<label class="sr" for="name-input">Backlog name</label>
      <input class="name-input" id="name-input" maxlength="60" autocomplete="off" value="${escapeHtml(state.name)}">`;
    const input = document.getElementById("name-input");
    input.focus();
    input.select();
    return;
  }
  wrap.innerHTML = `<h1 id="name-h" title="Click to rename"></h1>
    <button class="rename" data-rename aria-label="Rename this backlog" title="Rename">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>
    </button>`;
  const h = document.getElementById("name-h");
  h.textContent = state.name;
  h.classList.toggle("long", state.name.length > 16);
}

function finishRename(keep) {
  if (!renaming) return;
  const input = document.getElementById("name-input");
  const value = (input?.value || "").trim().replace(/\s+/g, " ").slice(0, 60);
  renaming = false;
  if (keep && value && value !== state.name) {
    state.name = value;
    save();
  }
  renderName();
  document.querySelector("#name-wrap .rename")?.focus({ preventScroll: true });
}

function wireName() {
  const wrap = document.getElementById("name-wrap");
  renderName();
  wrap.addEventListener("click", (event) => {
    event.stopPropagation();
    if (!renaming && (event.target.closest("[data-rename]") || event.target.closest("#name-h"))) {
      renaming = true;
      renderName();
    }
  });
  wrap.addEventListener("keydown", (event) => {
    if (!renaming) return;
    event.stopPropagation();
    if (event.key === "Enter") { event.preventDefault(); finishRename(true); }
    else if (event.key === "Escape") { event.preventDefault(); finishRename(false); }
  });
  // Clicking away from the name box saves it. (Only the box itself counts: the old
  // heading and pencil also lose focus when they're swapped out for the box.)
  wrap.addEventListener("focusout", (event) => {
    if (renaming && event.target.id === "name-input") finishRename(true);
  });
}

// ============================================================
// 3e. PAGES: Backlog and Journal, switched from the header.
//     The address ends in #journal on the Journal page, so you can link to it.
// ============================================================
const PAGES = ["backlog", "journal", "completed"];
let page = PAGES.includes(location.hash.slice(1)) ? location.hash.slice(1) : loadLocal("backlog-page", "backlog");
if (!PAGES.includes(page)) page = "backlog";

function setPage(p) {
  if (!PAGES.includes(p)) return;
  const changed = p !== page;
  page = p;
  saveLocal("backlog-page", p);
  if (location.hash.slice(1) !== p) history.replaceState(null, "", "#" + p);
  document.getElementById("view-backlog").hidden = p !== "backlog";
  document.getElementById("view-journal").hidden = p !== "journal";
  document.getElementById("view-completed").hidden = p !== "completed";
  renderNav();
  if (p === "journal") renderJournal();
  else if (p === "completed") renderCompleted();
  else { showLabel(labelTarget()); followList(); }
  placeFollowMark();
  if (changed) scrollTo({ top: 0 });
}

function renderNav() {
  const n = state.games.reduce((t, g) => t + g.sessions.length, 0) + state.archive.length;
  const done = state.games.filter((g) => g.status === "finished").length;
  document.getElementById("pagenav").innerHTML = `
    <button data-page="backlog" ${page === "backlog" ? 'aria-current="page"' : ""}>Backlog</button>
    <button data-page="journal" ${page === "journal" ? 'aria-current="page"' : ""}>Journal${n ? `<span class="count">${n}</span>` : ""}</button>
    <button data-page="completed" ${page === "completed" ? 'aria-current="page"' : ""}>Completed${done ? `<span class="count">${done}</span>` : ""}</button>`;
}

// Every journal entry: games still in the backlog, plus the archive of removed games.
function allEntries() {
  const where = new Map(state.games.map((g, i) => [g.title, i]));
  const out = [];
  state.games.forEach((g, i) => g.sessions.forEach((s) => out.push({ s, game: g.title, index: i })));
  state.archive.forEach((a) => out.push({ s: a, game: a.game, index: where.has(a.game) ? where.get(a.game) : null }));
  return out;
}

// Journal page filters (remembered in this browser).
const jv = Object.assign({ q: "", game: "all", mood: "all", sort: "new" }, loadLocal("backlog-journal-view", {}));
const saveJv = () => saveLocal("backlog-journal-view", jv);

function renderJournal() {
  const all = allEntries();
  const games = new Map();   // title -> still in backlog?
  all.forEach((e) => games.set(e.game, games.get(e.game) || e.index != null));
  if (jv.game !== "all" && !games.has(jv.game)) jv.game = "all";

  // Summary
  const hours = all.reduce((t, e) => t + (e.s.hours || 0), 0);
  const gone = all.filter((e) => e.index == null).length;
  document.getElementById("j-summary").textContent = all.length
    ? `${all.length} entr${all.length > 1 ? "ies" : "y"} · ${games.size} game${games.size > 1 ? "s" : ""} · ${fmtHours(hours)} h logged` +
      (gone ? ` · ${gone} from removed games` : "")
    : "Your play-session diary, across every game.";

  // Game picker
  const sel = document.getElementById("j-game");
  const titles = [...games.keys()].sort((a, b) => shelfKey(a).localeCompare(shelfKey(b)));
  sel.innerHTML = `<option value="all">All games</option>` +
    titles.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}${games.get(t) ? "" : " (removed)"}</option>`).join("");
  sel.value = jv.game;
  document.getElementById("j-search").value = jv.q;
  document.getElementById("j-sort").value = jv.sort;

  // Mood chips with counts
  const count = (m) => all.filter((e) => e.s.mood === m).length;
  document.getElementById("j-mood").innerHTML =
    `<button type="button" class="mood" data-jmood="all" aria-pressed="${jv.mood === "all"}">All <span class="n">${all.length}</span></button>` +
    Object.entries(MOODS).map(([m, label]) => `
      <button type="button" class="mood m-${m}" data-jmood="${m}" aria-pressed="${jv.mood === m}">${faceSvg(m)}${label} <span class="n">${count(m)}</span></button>`).join("");

  // Filter + sort
  const q = jv.q.trim().toLowerCase();
  const list = all.filter((e) =>
    (jv.game === "all" || e.game === jv.game) &&
    (jv.mood === "all" || e.s.mood === jv.mood) &&
    (!q || e.game.toLowerCase().includes(q) || (e.s.note || "").toLowerCase().includes(q)));
  const key = (e) => `${e.s.date} ${e.s.time || "00:00"} ${e.s.created || ""}`;
  list.sort((a, b) => (jv.sort === "old" ? 1 : -1) * key(a).localeCompare(key(b)));

  const box = document.getElementById("j-list");
  if (!all.length) {
    box.innerHTML = `<div class="jempty"><strong>No entries yet</strong>
      Open a game's Journal on the Backlog page and log a session. Every entry shows up here.</div>`;
    return;
  }
  if (!list.length) {
    box.innerHTML = `<div class="jempty"><strong>Nothing matches</strong>Try a different search, game or mood.</div>`;
    return;
  }

  // Group: month > day > game. Days and games are collapsible.
  const days = [];            // [{ date, games: [{ game, index, items: [] }] }] in display order
  const dayMap = new Map();
  list.forEach((e) => {
    let day = dayMap.get(e.s.date);
    if (!day) { day = { date: e.s.date, games: [], gameMap: new Map() }; dayMap.set(e.s.date, day); days.push(day); }
    let g = day.gameMap.get(e.game);
    if (!g) { g = { game: e.game, index: e.index, items: [] }; day.gameMap.set(e.game, g); day.games.push(g); }
    g.items.push(e);
  });

  let html = "", month = "", monthDays = [];
  const flush = () => {
    if (!monthDays.length) return;
    const n = monthDays.reduce((t, d) => t + d.games.reduce((u, g) => u + g.items.length, 0), 0);
    html += `<h2 class="jmonth">${month} <span>· ${n} entr${n > 1 ? "ies" : "y"}</span></h2>` + monthDays.map(jDayHtml).join("");
    monthDays = [];
  };
  days.forEach((day) => {
    const [y, m] = day.date.split("-").map(Number);
    const label = new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
    if (label !== month) { flush(); month = label; }
    monthDays.push(day);
  });
  flush();
  jRenderedAt = Date.now();
  box.innerHTML = html;
}

// Which day / game groups are open. Days start open, game groups start closed;
// whatever you open or close is remembered in this browser.
const jOpen = loadLocal("backlog-journal-open", {});
let jRenderedAt = 0;
const hasActive = (items) => items.some((e) => editing?.id === e.s.id || pendingDelete === e.s.id);

const moodFaces = (items) => {
  const moods = [...new Set(items.map((e) => e.s.mood).filter((m) => MOODS[m]))];
  return moods.length
    ? `<span class="jfaces" aria-label="Moods: ${moods.map((m) => MOODS[m]).join(", ")}">${moods.map((m) => `<span class="m-${m}">${faceSvg(m)}</span>`).join("")}</span>`
    : "";
};
const sumHours = (items) => items.reduce((t, e) => t + (e.s.hours || 0), 0);
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

function jDayHtml(day) {
  const items = day.games.flatMap((g) => g.items);
  const [y, m, d] = day.date.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const key = day.date;
  const filtering = jv.q.trim() || jv.game !== "all" || jv.mood !== "all";
  const open = hasActive(items) || filtering || (jOpen["d:" + key] ?? true);
  const h = sumHours(items);
  return `
    <details class="jday-group" data-jday="${key}" ${open ? "open" : ""}>
      <summary class="jday-sum">
        <span class="jdate" aria-hidden="true">
          <span class="jwk">${dt.toLocaleDateString(undefined, { weekday: "short" })}</span>
          <span class="jday">${d}</span>
          <span class="jmon">${dt.toLocaleDateString(undefined, { month: "short" })}</span>
        </span>
        <span class="jday-info">
          <strong>${dt.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" })}</strong>
          <span>${plural(day.games.length, "game", "games")} · ${plural(items.length, "entry", "entries")}${h ? ` · ${fmtHours(h)} h` : ""}</span>
        </span>
        ${moodFaces(items)}
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="jday-body">${day.games.map((g) => jGameHtml(day.date, g)).join("")}</div>
    </details>`;
}

function jGameHtml(date, g) {
  const key = date + "|" + g.game;
  const filtering = jv.q.trim() || jv.mood !== "all";
  const open = hasActive(g.items) || filtering || (jOpen["g:" + key] ?? false);
  const h = sumHours(g.items);
  const gone = g.index == null;
  return `
    <details class="jgame-group" data-jgroup="${escapeHtml(key)}" ${open ? "open" : ""}>
      <summary class="jgame-sum">
        <span class="jgame-name${gone ? " gone" : ""}">${escapeHtml(g.game)}</span>
        ${gone ? `<span class="tag">Removed</span>` : ""}
        <span class="jgame-sub">${plural(g.items.length, "entry", "entries")}${h ? ` · ${fmtHours(h)} h` : ""}</span>
        ${mediaCountHtml(g.items.flatMap((e) => e.s.media || []))}
        ${moodFaces(g.items)}
        <span class="chev" aria-hidden="true"></span>
      </summary>
      <div class="jgame-body">
        ${gone ? "" : `<button type="button" class="jopen" data-jgame="${g.index}">Show in backlog</button>`}
        ${g.items.map(jItemHtml).join("")}
      </div>
    </details>`;
}

// One entry inside a game group (the day and game are already in the headings above it).
function jItemHtml({ s, index }) {
  const isEditing = editing?.id === s.id;
  const confirming = pendingDelete === s.id;
  const bits = [s.hours ? `${fmtHours(s.hours)} h played` : "", escapeHtml(s.platform || "")].filter(Boolean).join(" · ");
  return `
    <article class="jitem${MOODS[s.mood] ? ` m-${s.mood}` : ""}">
      <div class="jhead">
        ${s.time ? `<span class="jtime">${fmtTime(s.time)}</span>` : `<span class="jtime">No time</span>`}
        ${MOODS[s.mood] ? `<span class="entry-mood m-${s.mood}">${faceSvg(s.mood)}${MOODS[s.mood]}</span>` : ""}
        ${s.edited ? `<span class="edited-flag">edited</span>` : ""}
        ${isEditing ? "" : `
        <span class="entry-actions">
          <button type="button" class="del" data-jedit="${s.id}">Edit</button>
          <button type="button" class="del ${confirming ? "confirm" : ""}" data-jdel="${s.id}">${confirming ? "Confirm delete" : "Delete"}</button>
        </span>`}
      </div>
      ${isEditing ? editForm(s, index ?? "") : `
      ${s.note ? `<p class="entry-note">${escapeHtml(s.note)}</p>` : ""}
      ${mediaGridHtml(s)}
      <div class="jmeta">${bits ? `<span>${bits}</span>` : ""}${stampLine(s)}</div>`}
    </article>`;
}

function wirePages() {
  renderNav();
  document.getElementById("pagenav").addEventListener("click", (event) => {
    event.stopPropagation();
    const b = event.target.closest("[data-page]");
    if (b) setPage(b.dataset.page);
  });
  addEventListener("hashchange", () => {
    const h = location.hash.slice(1);
    if (PAGES.includes(h) && h !== page) setPage(h);
  });

  const jview = document.getElementById("view-journal");
  const refocus = (sel) => jview.querySelector(sel)?.focus({ preventScroll: true });
  jview.addEventListener("click", (event) => {
    const b = event.target.closest("button");
    if (!b) return;
    event.stopPropagation();
    const d = b.dataset;
    // Clicking anything other than "Confirm delete" cancels a pending delete.
    const hadPending = pendingDelete;
    if (d.jdel === undefined) pendingDelete = null;

    if (d.jedit) {
      if (!startEdit(d.jedit)) return;
      renderJournal();
      document.getElementById(`edit-note-${d.jedit}`)?.focus();
    } else if (d.jdel) {
      if (pendingDelete !== d.jdel) {
        pendingDelete = d.jdel;   // first click asks for confirmation
        renderJournal();
        refocus(`[data-jdel="${d.jdel}"]`);
      } else {
        pendingDelete = null;
        deleteEntry(d.jdel);
        save();
        update();
      }
    } else if (d.editMood) {
      if (editing) editing.mood = editing.mood === d.editMood ? "" : d.editMood;
      b.parentElement.querySelectorAll("[data-edit-mood]").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.editMood === editing?.mood)));
      return;
      refocus(`[data-edit-mood="${d.editMood}"]`);
