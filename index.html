    } else if (d.cancelEdit) {
      discardEditUploads();
      editing = null;
      renderJournal();
      refocus(`[data-jedit="${d.cancelEdit}"]`);
    } else if (b.type === "submit" && b.form) {
      return;   // "Save changes": handled by the submit listener below
    } else if (d.jmood) { jv.mood = b.dataset.jmood; saveJv(); renderJournal();
      jview.querySelector(`[data-jmood="${b.dataset.jmood}"]`)?.focus({ preventScroll: true }); }
    else if (b.dataset.jgame !== undefined) {
      // Go to that game on the Backlog page.
      // Only offered for games still in the backlog; check again in case it was just removed.
      const i = Number(b.dataset.jgame);
      if (!state.games[i]) { renderJournal(); return; }
      setPage("backlog");
      requestAnimationFrame(() => jumpTo(i));   // scroll the list to it and highlight it
    } else if (hadPending) {
      renderJournal();
    }
  });
  // Remember which day / game groups you open and close. ("toggle" doesn't bubble.)
  jview.addEventListener("toggle", (event) => {
    const el = event.target;
    if (Date.now() - jRenderedAt < 150) return;   // ignore groups that just opened because of a redraw
    if (el.dataset?.jday) jOpen["d:" + el.dataset.jday] = el.open;
    else if (el.dataset?.jgroup) jOpen["g:" + el.dataset.jgroup] = el.open;
    else return;
    saveLocal("backlog-journal-open", jOpen);
  }, true);

  jview.addEventListener("submit", (event) => {
    const form = event.target.closest("form[data-edit]");
    if (!form) return;
    event.preventDefault();
    event.stopPropagation();
    const id = form.dataset.edit;
    if ((uploading["edit:" + id] || 0) > 0) return;   // still uploading
    if (applyEntryEdit(id, form.elements, editing?.mood, editing?.media)) save();
    editing = null;
    update();   // refreshes both pages (hours, platforms, counts)
    refocus(`[data-jedit="${id}"]`);
  });
  jview.addEventListener("input", (event) => {
    event.stopPropagation();
    // Typing in an edit form: keep the changes in `editing` so a redraw doesn't lose them.
    const form = event.target.closest("form[data-edit]");
    if (form && editing) {
      const f = form.elements;
      Object.assign(editing, { date: f.date.value, time: f.time.value, hours: f.hours.value,
                               platform: f.platform.value, note: f.note.value });
      return;
    }
    if (event.target.id === "j-search") {
      jv.q = event.target.value; saveJv(); renderJournal();
      document.getElementById("j-search").focus();
    }
  });
  jview.addEventListener("change", (event) => {
    event.stopPropagation();
    if (event.target.closest("form[data-edit]")) return;
    if (event.target.id === "j-game") { jv.game = event.target.value; saveJv(); renderJournal(); }
    else if (event.target.id === "j-sort") { jv.sort = event.target.value; saveJv(); renderJournal(); }
  });
}

// ============================================================
// 3f. PHOTOS & VIDEOS: attach them to journal entries.
//     Files are stored on this device (IndexedDB, see LOCAL MEDIA STORE below); each entry
//     keeps a list of { id, type }.
// ============================================================
let assetsApi = null;        // set once claude.ai grants uploads (writers only)
const uploading = {};        // form key -> number of files still uploading
const mediaMsg = {};         // form key -> last error message
const MAX_BYTES = 20 * 1024 * 1024;
const IMAGE_OK = ["image/jpeg", "image/png", "image/gif", "image/webp"];
const VIDEO_OK = ["video/mp4", "video/webm"];
// Photos and videos are stored in this device's database (IndexedDB). Each gets a short-lived
// in-memory address (an "object URL") so it can be shown; they're all loaded once at startup.
const mediaUrls = new Map();   // asset id -> object URL
const blobUrl = (id) => mediaUrls.get(id) || "";
const totalUploading = () => Object.values(uploading).reduce((t, n) => t + n, 0);

const ICON_CAMERA = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>`;
const ICON_PLAY = `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="rgba(0,0,0,.45)"/><path d="M10 8l6 4-6 4z" fill="#fff"/></svg>`;

function mediaCountHtml(media) {
  const list = media || [];

  const photos = list.filter((m) => m.type === "image").length;
  const videos = list.length - photos;
  const label = [photos ? plural(photos, "photo", "photos") : "", videos ? plural(videos, "video", "videos") : ""].filter(Boolean).join(", ");
  return `<span class="media-count" title="${label}">${ICON_CAMERA}<span class="sr">${label}</span><span aria-hidden="true">${list.length}</span></span>`;
}

// The thumbnails on a saved entry; tap one to open the viewer.
function mediaGridHtml(s) {
  const list = s.media || [];
  if (!list.length) return "";
  return `<div class="media-grid">${list.map((m, i) => `
    <button class="mtile" data-media-open="${s.id}" data-media-i="${i}"
      aria-label="Open ${m.type === "video" ? "video" : "photo"} ${i + 1} of ${list.length}">
      ${m.type === "video"
        ? `<video src="${blobUrl(m.id)}#t=0.1" muted playsinline preload="metadata"></video><span class="play">${ICON_PLAY}</span>`
        : `<img src="${blobUrl(m.id)}" alt="" loading="lazy">`}
    </button>`).join("")}</div>`;
}

// The attach area inside the log and edit forms.
function formMediaHtml(list, key, scopeAttrs) {
  const busy = uploading[key] || 0;
  return `
    <div class="media-field">
      <div class="mthumbs">${list.map((m) => `
        <div class="mthumb">
          ${m.type === "video"
            ? `<video src="${blobUrl(m.id)}#t=0.1" muted playsinline preload="metadata"></video><span class="play">${ICON_PLAY}</span>`
            : `<img src="${blobUrl(m.id)}" alt="">`}
          <button type="button" class="x" ${scopeAttrs} data-media-remove="${m.id}" aria-label="Remove this ${m.type === "video" ? "video" : "photo"}">×</button>
        </div>`).join("")}${Array.from({ length: busy }, () => `<div class="mthumb busy">Uploading…</div>`).join("")}</div>
      ${assetsApi ? `
        <label class="media-add">${ICON_CAMERA}Add photos or videos
          <input type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple ${scopeAttrs} data-media-input>
        </label>` : ""}
      <p class="media-msg" role="status">${escapeHtml(mediaMsg[key] || "")}</p>
    </div>`;
}

// Make a picked file ready to upload. Big or unusual photos (like iPhone HEIC) are
// redrawn as a JPEG no wider than 2400px; videos must already be MP4/WebM/MOV under 20 MB.
async function prepareFile(file) {
  const type = (file.type || "").toLowerCase();
  const name = (file.name || "").toLowerCase();
  const isVideo = type.startsWith("video/") || /\.(mp4|m4v|webm|mov)$/.test(name);
  if (isVideo) {
    let t = type;
    if (!VIDEO_OK.includes(t)) {
      if (t === "video/quicktime" || /\.(mov|m4v)$/.test(name)) t = "video/mp4";   // iPhone .mov (H.264) plays as MP4
      else if (/\.webm$/.test(name)) t = "video/webm";
      else if (/\.mp4$/.test(name)) t = "video/mp4";
      else throw { code: "unsupported_type" };
    }
    if (file.size > MAX_BYTES) throw { code: "too_large", video: true };
    return { blob: file, type: t, kind: "video" };
  }
  if (type === "image/gif" && file.size <= MAX_BYTES) return { blob: file, type, kind: "image" };
  if (IMAGE_OK.includes(type) && file.size <= 3 * 1024 * 1024) return { blob: file, type, kind: "image" };
  // Shrink / convert.
  let bitmap;
  try { bitmap = await createImageBitmap(file); } catch (e) { throw { code: "unsupported_type" }; }
  const scale = Math.min(1, 2400 / Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(bitmap.width * scale);
  canvas.height = Math.round(bitmap.height * scale);
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close?.();
  const blob = await new Promise((res) => canvas.toBlob(res, "image/jpeg", 0.86));
  if (!blob) throw { code: "unsupported_type" };
  if (blob.size > MAX_BYTES) throw { code: "too_large" };
  return { blob, type: "image/jpeg", kind: "image" };
}

function uploadErrorText(err) {
  switch (err?.code) {
    case "too_large": return err.video
      ? "That video is over 20 MB. Trim it or export it at a lower quality, then try again."
      : "That file is over 20 MB.";
    case "unsupported_type": return "That file type can't be added. Use a photo, or an MP4, WebM or MOV video.";
    case "quota_or_state": return "Storage for this backlog is full. Remove some photos or videos first.";
    case "rate_limited": return "Too many uploads at once. Wait a moment, then add the rest.";
    case "not_granted": case "capability_disabled": case "capability_removed":
      return "Uploading isn't available in this view.";
    case "upstream_auth": return "Your session expired. Reload the page, then try again.";
    default: return "That upload didn't go through. Try again.";
  }
}

// Where uploaded files go: the new-entry draft for a game, or the entry being edited.
function mediaTarget(scope, title) {
  if (scope === "log") {
    drafts[title] = drafts[title] || {};
    drafts[title].media = drafts[title].media || [];
    return { list: drafts[title].media, key: "log:" + title, persist: saveDrafts };
  }
  if (scope === "edit" && editing) return { list: editing.media, key: "edit:" + editing.id, persist: () => {} };
  return null;
}

async function uploadFiles(files, scope, title) {
  const start = mediaTarget(scope, title);
  if (!start || !assetsApi) return;
  const key = start.key;
  mediaMsg[key] = "";
  for (const file of files) {
    uploading[key] = (uploading[key] || 0) + 1;
    redraw();
    try {
      const ready = await prepareFile(file);
      let result;
      try { result = await assetsApi.upload(ready.blob, { type: ready.type }); }
      catch (err) {
        if (err?.code === "store_unavailable") {   // one retry after a short pause
          await new Promise((r) => setTimeout(r, 1500));
          result = await assetsApi.upload(ready.blob, { type: ready.type });
        } else throw err;
      }
      const target = mediaTarget(scope, title);
      if (target && target.key === key) { target.list.push({ id: result.id, type: ready.kind }); target.persist(); }
      else deleteAsset(result.id);   // the form was closed while this uploaded
    } catch (err) {
      mediaMsg[key] = uploadErrorText(err);
    } finally {
      uploading[key] -= 1;
      redraw();
    }
  }
}

// Remove a photo/video from a form before saving.
function removeFormMedia(scope, title, id) {
  const target = mediaTarget(scope, title);
  if (!target) return;
  const i = target.list.findIndex((m) => m.id === id);
  if (i === -1) return;
  target.list.splice(i, 1);
  target.persist();
  // A file added in this form and never saved can go right away. One already saved on
  // the entry is deleted only when you press "Save changes".
  if (scope === "log" || !editing?.origMedia.includes(id)) deleteAsset(id);
  redraw();
}

// Throw away photos/videos uploaded during an edit that's being cancelled.
function discardEditUploads() {
  if (!editing) return;
  editing.media.filter((m) => !editing.origMedia.includes(m.id)).forEach((m) => deleteAsset(m.id));
}

function deleteAsset(id) {
  if (!assetsApi || !id) return;
  assetsApi.delete(id).catch(() => {});   // already gone is fine
}

// Redraw whichever page is showing, keeping typed text (drafts / editing hold it).
function redraw() {
  if (page === "journal") renderJournal(); else update();
}

// ---------- the full-screen viewer ----------
let lb = null;   // { items, i, caption, returnFocus }
function openViewer(entryId, i, from) {
  const found = findEntry(entryId);
  if (!found || !(found.entry.media || []).length) return;
  const title = found.game ? found.game.title : found.entry.game;
  lb = { items: found.entry.media, i, caption: `${title} · ${fmtDate(found.entry.date)}`, returnFocus: from };
  document.documentElement.style.overflow = "hidden";
  renderViewer();
}
function closeViewer() {
  const back = lb?.returnFocus;
  lb = null;
  document.documentElement.style.overflow = "";
  document.getElementById("lightbox")?.remove();
  back?.focus({ preventScroll: true });
}
function renderViewer() {
  let el = document.getElementById("lightbox");
  if (!el) {
    el = document.createElement("div");
    el.id = "lightbox";
    el.className = "lightbox";
    el.setAttribute("role", "dialog");
    el.setAttribute("aria-modal", "true");
    el.setAttribute("aria-label", "Photo and video viewer");
    el.addEventListener("click", (event) => {
      const b = event.target.closest("[data-lb]");
      if (b?.dataset.lb === "close" || event.target === el) closeViewer();
      else if (b) stepViewer(b.dataset.lb === "next" ? 1 : -1);
    });
    document.body.appendChild(el);
  }
  const m = lb.items[lb.i];
  const many = lb.items.length > 1;
  const caption = m.caption || lb.caption;
  el.innerHTML = `
    <button class="lb-close" data-lb="close" aria-label="Close">×</button>
    ${many ? `<button class="lb-nav prev" data-lb="prev" aria-label="Previous">‹</button>
              <button class="lb-nav next" data-lb="next" aria-label="Next">›</button>` : ""}
    <figure class="lb-figure">
      ${m.type === "video"
        ? `<video src="${blobUrl(m.id)}" controls autoplay playsinline></video>`
        : `<img src="${blobUrl(m.id)}" alt="${m.type === "video" ? "Video" : "Photo"} from ${escapeHtml(caption)}">`}
      <figcaption>${escapeHtml(caption)}${many ? ` · ${lb.i + 1} of ${lb.items.length}` : ""}</figcaption>
    </figure>`;
  el.querySelector(".lb-close").focus({ preventScroll: true });
}
function stepViewer(dir) {
  if (!lb) return;
  lb.i = (lb.i + dir + lb.items.length) % lb.items.length;
  renderViewer();
}

function wireMedia() {
  // Capture phase, so these run before the page's other click/change handlers.
  document.addEventListener("change", (event) => {
    const input = event.target.closest?.("[data-media-input]");
    if (!input) return;
    event.stopPropagation();
    const files = [...(input.files || [])];
    input.value = "";
    if (files.length) uploadFiles(files, input.dataset.scope, input.dataset.title);
  }, true);
  document.addEventListener("click", (event) => {
    const rm = event.target.closest?.("[data-media-remove]");
    const open = event.target.closest?.("[data-media-open]");
    if (rm) {
      event.stopPropagation();
      removeFormMedia(rm.dataset.scope, rm.dataset.title, rm.dataset.mediaRemove);
    } else if (open) {
      event.stopPropagation();
      openViewer(open.dataset.mediaOpen, Number(open.dataset.mediaI), open);
    }
  }, true);
  document.addEventListener("keydown", (event) => {
    if (!lb) return;
    if (event.key === "Escape") { event.preventDefault(); event.stopPropagation(); closeViewer(); }
    else if (event.key === "ArrowRight") stepViewer(1);
    else if (event.key === "ArrowLeft") stepViewer(-1);
    else if (event.key === "Tab") {
      // keep focus inside the viewer
      const els = [...document.querySelectorAll("#lightbox button, #lightbox video")];
      const i = els.indexOf(document.activeElement);
      event.preventDefault();
      els[(i + (event.shiftKey ? -1 : 1) + els.length) % els.length]?.focus();
    }
  }, true);
}

// ============================================================
// 3g. COMPLETED: every game marked Finished, and your hand-made Top list.
//     "Ranked" is your own order (drag the handle, or use the arrows); the other
//     sorts are just different views of the same games.
// ============================================================
function setStatus(game, status) {
  const was = game.status;
  game.status = status;
  if (status === "finished" && was !== "finished") {
    game.finishedAt = new Date().toISOString();
    if (!state.ranking.includes(game.title)) state.ranking.push(game.title);   // new finishes start at the bottom
  } else if (status !== "finished" && was === "finished") {
    delete game.finishedAt;
    state.ranking = state.ranking.filter((t) => t !== game.title);
  }
}

// Finished games in Top-list order. Any finished game missing from the list goes to the bottom.
function rankedGames() {
  const finished = state.games.map((g, index) => ({ g, index })).filter(({ g }) => g.status === "finished");
  const pos = new Map(state.ranking.map((t, i) => [t, i]));
  return finished.sort((a, b) =>
    (pos.get(a.g.title) ?? 1e6) - (pos.get(b.g.title) ?? 1e6) ||
    (a.g.finishedAt || "").localeCompare(b.g.finishedAt || ""));
}

let csort = loadLocal("backlog-completed-sort", "ranked");
if (!["ranked", "rating", "hours", "recent", "title"].includes(csort)) csort = "ranked";

const ICON_GRIP = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>`;

function starsReadOnly(rating) {
  let html = `<span class="rating sm" aria-label="${rating ? rating.toFixed(1) + " out of 5 stars" : "Not rated"}">`;
  for (let n = 1; n <= 5; n++) html += `<span class="rs ${rating >= n ? "full" : rating >= n - 0.5 ? "half" : ""}" aria-hidden="true"></span>`;
  return html + `</span>`;
}

function renderCompleted() {
  const ranked = rankedGames();
  const rankOf = new Map(ranked.map((e, i) => [e.g.title, i + 1]));
  // Only "Ranked" uses the Top list. Every other sort ignores it completely
  // and breaks ties by title, so the order never depends on your rankings.
  const byTitle = (a, b) => shelfKey(a.g.title).localeCompare(shelfKey(b.g.title)) || a.g.title.localeCompare(b.g.title);
  let list = csort === "ranked" ? [...ranked]
    : state.games.map((g, index) => ({ g, index })).filter(({ g }) => g.status === "finished");
  if (csort === "rating") list.sort((a, b) => (b.g.rating || 0) - (a.g.rating || 0) || (b.g.hours || 0) - (a.g.hours || 0) || byTitle(a, b));
  else if (csort === "hours") list.sort((a, b) => (b.g.hours || 0) - (a.g.hours || 0) || byTitle(a, b));
  else if (csort === "recent") list.sort((a, b) => (b.g.finishedAt || "").localeCompare(a.g.finishedAt || "") || byTitle(a, b));
  else if (csort === "title") list.sort(byTitle);

  const hours = ranked.reduce((t, e) => t + e.g.hours, 0);
  const rated = ranked.filter((e) => e.g.rating);
  const avg = rated.length ? rated.reduce((t, e) => t + e.g.rating, 0) / rated.length : 0;
  const entries = ranked.reduce((t, e) => t + e.g.sessions.length, 0);
  const media = ranked.reduce((t, e) => t + e.g.sessions.reduce((n, s) => n + (s.media || []).length, 0), 0);
  document.getElementById("c-summary").textContent = ranked.length
    ? `${plural(ranked.length, "game", "games")} completed of ${state.games.length}` +
      (hours ? ` · ${fmtHours(hours)} h played` : "") +
      (avg ? ` · average ★ ${avg.toFixed(1)}` : "") +
      (entries ? ` · ${plural(entries, "journal entry", "journal entries")}` : "") +
      (media ? ` · ${plural(media, "photo or video", "photos & videos")}` : "")
    : "Games you mark as Finished show up here.";
  document.getElementById("c-sort").value = csort;
  document.getElementById("c-hint").textContent = !ranked.length ? ""
    : csort === "ranked" ? (ranked.length > 1 ? "Drag ⠿ or use the arrows to reorder your Top list." : "")
    : "Switch to Ranked to reorder your Top list.";

  const box = document.getElementById("c-list");
  box.classList.toggle("ranked", csort === "ranked");
  if (!ranked.length) {
    box.innerHTML = `<li class="jempty"><strong>No completed games yet</strong>
      When you set a game to Finished on the Backlog page, it lands here and joins your Top list.</li>`;
    return;
  }
  box.innerHTML = list.map(({ g, index }, i) => completedRow(g, index, rankOf.get(g.title), i, list.length)).join("");
}

// Which games have their overview open (per viewer).
const copen = new Set(loadLocal("backlog-completed-open", []));
const saveCopen = () => saveLocal("backlog-completed-open", [...copen]);
let cjust = "";   // the overview that was just opened (only that one animates in)

// Every photo/video from a game's entries, oldest entry first, each with a caption.
function gameMedia(g) {
  return [...g.sessions]
    .sort((a, b) => (a.date + (a.time || "")).localeCompare(b.date + (b.time || "")))
    .flatMap((s) => (s.media || []).map((m) => ({ ...m, caption: `${g.title} · ${fmtDate(s.date)}` })));
}

// The overview under a completed game: totals, moods, all photos & videos, and every entry.
function completedOverview(g, index) {
  const list = [...g.sessions].sort((a, b) => (b.date + (b.time || "")).localeCompare(a.date + (a.time || "")));
  if (!list.length) {
    return `<div class="cover"><p class="cnone">No journal entries for this game yet. Log a session from the Backlog page to chart your run.</p></div>`;
  }
  const logged = list.reduce((t, s) => t + (s.hours || 0), 0);
  const first = list[list.length - 1].date, last = list[0].date;
  const moods = Object.keys(MOODS).map((m) => [m, list.filter((s) => s.mood === m).length]).filter(([, n]) => n);
  const media = gameMedia(g);
  const stats = [
    `<span><b>${list.length}</b> ${list.length === 1 ? "entry" : "entries"}</span>`,
    logged ? `<span><b>${fmtHours(logged)} h</b> logged</span>` : "",
    `<span>${first === last ? fmtDate(first) : `${fmtDate(first)} → ${fmtDate(last)}`}</span>`,
    media.length ? `<span><b>${media.length}</b> ${media.length === 1 ? (media[0].type === "video" ? "video" : "photo") : "photos & videos"}</span>` : "",
  ].filter(Boolean).join("");
  const moodHtml = moods.length ? `<div class="cmoods" aria-label="Moods">${moods.map(([m, n]) =>
    `<span class="entry-mood m-${m}">${faceSvg(m)}${MOODS[m]} <b>${n}</b></span>`).join("")}</div>` : "";
  const gallery = media.length ? `
    <h4 class="csub">Photos &amp; videos</h4>
    <div class="media-grid cgallery">${media.map((m, i) => `
      <button type="button" class="mtile" data-cgallery="${index}" data-media-i="${i}"
        aria-label="Open ${m.type === "video" ? "video" : "photo"} ${i + 1} of ${media.length}">
        ${m.type === "video"
          ? `<video src="${blobUrl(m.id)}#t=0.1" muted playsinline preload="metadata"></video><span class="play">${ICON_PLAY}</span>`
          : `<img src="${blobUrl(m.id)}" alt="" loading="lazy">`}
      </button>`).join("")}</div>` : "";
  const rows = list.map((s) => `
    <li class="centry${MOODS[s.mood] ? ` m-${s.mood}` : ""}">
      <div class="cehead">
        <span class="cedate">${fmtDate(s.date)}${s.time ? ` · ${fmtTime(s.time)}` : ""}</span>
        ${s.hours ? `<span>${fmtHours(s.hours)} h</span>` : ""}
        ${s.platform ? `<span>${escapeHtml(s.platform)}</span>` : ""}
        ${MOODS[s.mood] ? `<span class="entry-mood m-${s.mood}">${faceSvg(s.mood)}${MOODS[s.mood]}</span>` : ""}
        ${mediaCountHtml(s.media)}
      </div>
      ${s.note ? `<p class="cenote">${escapeHtml(s.note)}</p>` : ""}
    </li>`).join("");
  return `
    <div class="cover${cjust === g.title ? " fresh" : ""}">
      <div class="cstats">${stats}</div>
      ${moodHtml}
      ${gallery}
      <h4 class="csub">Entries</h4>
      <ul class="centries">${rows}</ul>
      <button type="button" class="jopen" data-cjournal="${index}">Open in Journal</button>
    </div>`;
}

function completedRow(g, index, rank, i, n) {
  const ranked = csort === "ranked";
  const entries = g.sessions.length;
  const nMedia = g.sessions.reduce((t, s) => t + (s.media || []).length, 0);
  const finished = g.finishedAt ? fmtDate(g.finishedAt.slice(0, 10)) : "";
  const title = escapeHtml(g.title);
  const open = copen.has(g.title);
  const top = ranked && rank <= 3 ? ` top top${rank}` : "";
  return `
    <li class="crow${top}${open ? " open" : ""}" data-title="${title}">
      ${ranked ? `<span class="crank" aria-label="Rank ${rank}"><small>Rank</small>${rank}</span>` : ""}
      <div class="cinfo">
        <span class="ctitle">${title}${g.genre ? `<span class="genre">${escapeHtml(g.genre)}</span>` : ""}</span>
        <div class="cmeta">
          ${starsReadOnly(g.rating)}
          ${g.hours ? `<span>${fmtHours(g.hours)} h</span>` : ""}
          ${g.platforms.length ? `<span>${g.platforms.join(", ")}</span>` : ""}
          ${finished ? `<span>Finished ${finished}</span>` : ""}
          <button type="button" class="jopen" data-cshow="${index}">Show in backlog</button>
        </div>
        <button type="button" class="cexp" data-cexp="${title}" aria-expanded="${open}">
          
          Overview${entries ? ` · ${plural(entries, "entry", "entries")}` : ""}${nMedia ? ` · <span class="media-count">${ICON_CAMERA}${nMedia}<span class="sr"> ${nMedia === 1 ? "photo or video" : "photos and videos"}</span></span>` : ""}
          <span class="chev" aria-hidden="true"></span>
        </button>
      </div>
      ${ranked && n > 1 ? `
      <div class="cmove">
        <button type="button" data-cmove="-1" data-ctitle="${title}" ${i === 0 ? "disabled" : ""} aria-label="Move ${title} up">↑</button>
        <button type="button" data-cmove="1" data-ctitle="${title}" ${i === n - 1 ? "disabled" : ""} aria-label="Move ${title} down">↓</button>
        <span class="chandle" data-chandle title="Drag to reorder" aria-hidden="true">${ICON_GRIP}</span>
      </div>` : ""}
      ${open ? completedOverview(g, index) : ""}
    </li>`;
}

// Save a new Top-list order (titles, best first).
function setRanking(titles) {
  const keep = state.ranking.filter((t) => !titles.includes(t));   // not-currently-finished leftovers
  state.ranking = [...titles, ...keep];
  save();
}

function wireCompleted() {
  const view = document.getElementById("view-completed");
  const list = document.getElementById("c-list");

  view.addEventListener("change", (event) => {
    event.stopPropagation();
    if (event.target.id === "c-sort") {
      csort = event.target.value;
      saveLocal("backlog-completed-sort", csort);
      renderCompleted();
    }
  });

  view.addEventListener("click", (event) => {
    const b = event.target.closest("button");
    if (!b) return;
    event.stopPropagation();
    if (b.dataset.cexp !== undefined) {
      // Open or close a game's overview.
      const t = b.closest("li").dataset.title;
      copen.has(t) ? copen.delete(t) : copen.add(t);
      saveCopen();
      cjust = t;
      renderCompleted();
      cjust = "";
      [...list.children].find((li) => li.dataset.title === t)?.querySelector("[data-cexp]")?.focus({ preventScroll: true });
    } else if (b.dataset.cgallery !== undefined) {
      // Step through every photo/video from this game in the viewer.
      const g = state.games[Number(b.dataset.cgallery)];
      if (!g) return;
      const items = gameMedia(g);
      if (!items.length) return;
      lb = { items, i: Number(b.dataset.mediaI) || 0, caption: g.title, returnFocus: b };
      document.documentElement.style.overflow = "hidden";
      renderViewer();
    } else if (b.dataset.cjournal !== undefined) {
      const g = state.games[Number(b.dataset.cjournal)];
      if (!g) return;
      Object.assign(jv, { game: g.title, q: "", mood: "all" });
      saveJv();
      setPage("journal");
      scrollTo({ top: 0 });
    } else if (b.dataset.cshow !== undefined) {
      const i = Number(b.dataset.cshow);
      if (!state.games[i]) return;
      setPage("backlog");
      requestAnimationFrame(() => jumpTo(i));
    } else if (b.dataset.cmove) {
      // Move one place up or down with the arrow buttons.
      const titles = rankedGames().map((e) => e.g.title);
      const t = b.dataset.ctitle;
      const from = titles.indexOf(t);
      const to = from + Number(b.dataset.cmove);
      if (from < 0 || to < 0 || to >= titles.length) return;
      titles.splice(to, 0, titles.splice(from, 1)[0]);
      setRanking(titles);
      renderCompleted();
      const row = [...list.children].find((li) => li.dataset.title === t);
      row?.classList.add("moved");
      const again = row?.querySelector(`[data-cmove="${b.dataset.cmove}"]`);
      (again && !again.disabled ? again : row?.querySelector("[data-cmove]:not(:disabled)"))?.focus({ preventScroll: true });
    }
  });

  // Drag to reorder: grab the ⠿ handle; the row follows the pointer and swaps with neighbours.
  let drag = null;
  const renumber = () => [...list.children].forEach((li, i) => {
    const r = li.querySelector(".crank");
    if (r) r.innerHTML = `<small>Rank</small>${i + 1}`;
    li.classList.toggle("top", i < 3);
    ["top1", "top2", "top3"].forEach((c, k) => li.classList.toggle(c, i === k));
  });
  list.addEventListener("pointerdown", (event) => {
    const handle = event.target.closest("[data-chandle]");
    if (!handle || csort !== "ranked") return;
    event.preventDefault();
    const row = handle.closest("li");
    drag = { row, startY: event.clientY, id: event.pointerId, moved: false };
    row.classList.add("dragging");
    handle.setPointerCapture(event.pointerId);
  });
  list.addEventListener("pointermove", (event) => {
    if (!drag || event.pointerId !== drag.id) return;
    const { row } = drag;
    row.style.translate = `0 ${event.clientY - drag.startY}px`;
    const r = row.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    const prev = row.previousElementSibling, next = row.nextElementSibling;
    const before = row.offsetTop;
    if (next && mid > next.getBoundingClientRect().top + next.offsetHeight / 2) list.insertBefore(next, row);
    else if (prev && mid < prev.getBoundingClientRect().top + prev.offsetHeight / 2) list.insertBefore(row, prev);
    const shift = row.offsetTop - before;
    if (shift) { drag.startY += shift; drag.moved = true; row.style.translate = `0 ${event.clientY - drag.startY}px`; renumber(); }
    // Scroll a little when dragging near the top or bottom of the screen.
    if (event.clientY < 70) scrollBy(0, -10);
    else if (event.clientY > innerHeight - 70) scrollBy(0, 10);
  });
  const endDrag = () => {
    if (!drag) return;
    const { row, moved } = drag;
    drag = null;
    row.classList.remove("dragging");
    row.style.translate = "";
    if (!moved) return;
    const titles = [...list.children].map((li) => li.dataset.title).filter(Boolean);
    const t = row.dataset.title;
    setRanking(titles);
    renderCompleted();
    [...list.children].find((li) => li.dataset.title === t)?.classList.add("moved");
  };
  list.addEventListener("pointerup", endDrag);
  list.addEventListener("pointercancel", endDrag);
}

// The first list row visible under the shelf bar, and how far down the screen it sits.
function listAnchor() {
  if (page !== "backlog") return {};
  const line = document.querySelector(".shelf-wrap").getBoundingClientRect().bottom;
  for (const el of document.getElementById("list").children) {
    const r = el.getBoundingClientRect();
    if (r.bottom > line && el.dataset.index !== undefined) return { anchor: Number(el.dataset.index), offset: r.top };
  }
  return {};
}

// ---------- BACK TO TOP ----------
let toTopShown = false;
function toTopVisible(show) {
  if (show === toTopShown) return;
  toTopShown = show;
  const b = document.getElementById("to-top");
  b.classList.toggle("show", show);
  b.tabIndex = show ? 0 : -1;
}
function wireToTop() {
  document.getElementById("to-top").addEventListener("click", (event) => {
    event.stopPropagation();
    scrollTo({ top: 0, behavior: reduceMotion.matches ? "auto" : "smooth" });
    // Put keyboard focus somewhere sensible at the top once there.
    document.querySelector("#pagenav [aria-current]")?.focus({ preventScroll: true });
  });
}

// ============================================================
// 4. SAVING: the page saves a new copy of itself with your data inside
// ============================================================
let saveTimer = null;

// Wait a moment after your last change, then save once (so rapid clicks = one save).
function save() {
  clearTimeout(saveTimer);
  setNote("Saving soon…");
  saveTimer = setTimeout(saveNow, 1500);
}

async function saveNow() {
  clearTimeout(saveTimer);
  saveTimer = null;
  try {
    localStorage.setItem("backlog-state", JSON.stringify(state));
    setNote("Saved on this device");
  } catch (e) {
    setNote("Couldn't save: this device's storage is full. Export a backup, then remove some photos or videos.");
  }
}

// Save right away if the app is closed or sent to the background with a change pending.
addEventListener("pagehide", () => { if (saveTimer) saveNow(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && saveTimer) saveNow(); });

function setNote(text) {
  const note = document.getElementById("saved-note");
  if (note) note.textContent = text;
}

// ---------- LOCAL MEDIA STORE ----------
const mediaDb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((resolve, reject) => {
    const req = indexedDB.open("backlog-media", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("files");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  }));
  const run = (mode, fn) => open().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction("files", mode);
    const out = fn(tx.objectStore("files"));
    tx.oncomplete = () => resolve(out && "result" in out ? out.result : undefined);
    tx.onerror = () => reject(tx.error || { code: "quota_or_state" });
    tx.onabort = () => reject(tx.error?.name === "QuotaExceededError" ? { code: "quota_or_state" } : (tx.error || { code: "upstream_error" }));
  }));
  return {
    put: (id, blob) => run("readwrite", (s) => s.put(blob, id)),
    del: (id) => run("readwrite", (s) => s.delete(id)),
    // Every stored file, as [id, blob] pairs.
    all: () => open().then((db) => new Promise((resolve, reject) => {
      const out = [];
      const req = db.transaction("files").objectStore("files").openCursor();
      req.onsuccess = () => { const c = req.result; if (!c) return resolve(out); out.push([c.key, c.value]); c.continue(); };
      req.onerror = () => reject(req.error);
    })),
  };
})();

// Same shape as the artifact's uploads, so the rest of the app doesn't need to change.
const localAssets = {
  async upload(blob, options = {}) {
    const typed = options.type && blob.type !== options.type ? new Blob([blob], { type: options.type }) : blob;
    const id = newId() + newId();
    await mediaDb.put(id, typed);
    mediaUrls.set(id, URL.createObjectURL(typed));
    return { id, url: mediaUrls.get(id), sizeBytes: typed.size, contentType: typed.type };
  },
  async delete(id) {
    const url = mediaUrls.get(id);
    if (url) URL.revokeObjectURL(url);
    mediaUrls.delete(id);
    await mediaDb.del(id);
    return { deleted: true };
  },
};

async function loadMedia() {
  try {
    const files = await mediaDb.all();
    files.forEach(([id, blob]) => mediaUrls.set(id, URL.createObjectURL(blob)));
    if (files.length) redraw();
  } catch (e) {
    // No database (for example a private window): photos and videos just aren't offered.
    assetsApi = null;
    redraw();
  }
}

// ---------- BACKUP & RESTORE ----------
// Your library lives only on this device, so it can be saved to a file and loaded back.
// (Photos and videos stay on the device; the backup holds everything else.)
function backupFileName() {
  const d = new Date();
  return `backlog-backup-${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}.json`;
}

async function exportBackup() {
  const data = { app: "backlog", version: 1, exported: new Date().toISOString(), state };
  const file = new File([JSON.stringify(data, null, 1)], backupFileName(), { type: "application/json" });
  // On phones, the share sheet lets you save to Files or send it somewhere; elsewhere it downloads.
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Backlog backup" }); setNote("Backup ready."); return; }
    catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  setNote(`Backup saved as ${file.name}.`);
}

let pendingRestore = null;   // a backup waiting for "Replace my library"
function renderBackupBar() {
  const bar = document.getElementById("backup-bar");
  if (pendingRestore) {
    const n = pendingRestore.games.length;
    bar.innerHTML = `
      <div class="remove-confirm" role="alert">
        <span>Replace your library with this backup (${n.toLocaleString()} game${n === 1 ? "" : "s"})? Your current games and entries will be replaced.</span>
        <button type="button" class="no" data-restore-cancel>Keep mine</button>
        <button type="button" class="yes" data-restore-confirm>Replace</button>
      </div>`;
    bar.querySelector("[data-restore-cancel]").focus();
    return;
  }
  bar.innerHTML = `
    <button type="button" class="more" data-backup>Export backup</button>
    <label class="more backup-pick">Restore from backup<input type="file" accept="application/json,.json" data-restore></label>`;
}

function wireBackup() {
  const bar = document.getElementById("backup-bar");
  renderBackupBar();
  bar.addEventListener("click", (event) => {
    event.stopPropagation();
    const b = event.target.closest("button");
    if (!b) return;
    if (b.dataset.backup !== undefined) exportBackup();
    else if (b.dataset.restoreCancel !== undefined) { pendingRestore = null; renderBackupBar(); }
    else if (b.dataset.restoreConfirm !== undefined) {
      state = normalize(pendingRestore);
      pendingRestore = null;
      selected = null; highlighted = null; hovered = null; editing = null; pendingDelete = null; pendingRemove = null;
      resetWave(); resetListPaging(); rowCache.clear();
      saveNow();
      renderName(); renderBackupBar(); update(); setPage("backlog");
      setNote("Backup restored.");
    }
  });
  bar.addEventListener("change", async (event) => {
    event.stopPropagation();
    const input = event.target.closest("[data-restore]");
    if (!input?.files?.[0]) return;
    try {
      const data = JSON.parse(await input.files[0].text());
      const s = data?.state ?? data;
      if (!Array.isArray(s?.games)) throw new Error("not a backup");
      pendingRestore = s;
      renderBackupBar();
    } catch (e) {
      setNote("That file isn't a Backlog backup.");
    }
    input.value = "";
  });
}

// ============================================================
// 5. START: draw the page, then connect saving when it's ready
// ============================================================
mount();
wireSchemeMenu();
wireName();
wireShelf();
wireShelfOpts();
wireToTop();
wireAddGame();
wirePages();
wireCompleted();
wireMedia();
// Just saved? Pick up where you were: same page, same spot in the list and on the shelf.
const resume = loadLocal("backlog-resume", null);
saveLocal("backlog-resume", null);
const resuming = resume && Date.now() - resume.t < 2 * 60 * 1000 && resume.page === page;
if (resuming) listLimit = Math.max(LIST_PAGE, Math.min(resume.limit || 0, state.games.length));
update();
setPage(page);
if (resuming) {
  setShelfX(resume.sx || 0);
  // Try a few times while fonts and rows settle, unless you've started scrolling yourself.
  let touched = false;
  const stop = () => { touched = true; };
  ["wheel", "touchstart", "keydown", "pointerdown"].forEach((t) => addEventListener(t, stop, { once: true, passive: true }));
  // Scroll so the row that was at the top is back in the same spot (falls back to the old position).
  const restore = () => {
    if (touched) return;
    const row = resume.anchor != null && page === "backlog" ? ensureRow(resume.anchor) : null;
    if (row) scrollTo(0, scrollY + row.getBoundingClientRect().top - resume.offset);
    else scrollTo(0, resume.y || 0);
  };
  restore();
  requestAnimationFrame(restore);
  document.fonts?.ready.then(restore);
  setTimeout(restore, 400);
  setTimeout(restore, 1000);
}
document.fonts?.ready.then(() => showLabel(labelTarget()));

// Photos and videos: stored on this device.
if ("indexedDB" in window) { assetsApi = localAssets; loadMedia(); }
wireBackup();
// Ask the browser to keep this app's data even when the device is low on space.
navigator.storage?.persist?.().catch(() => {});
// Work offline: cache the app itself (see sw.js). Only runs from a real web address.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
